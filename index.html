    tag: "Words repeated while relaxed create what they stand for.",
    what: "Short sentences repeated mentally at level, plus the daytime habit of replacing negative phrases. Silva’s view is that words and pictures held while relaxed act as instructions to the mind.",
    steps: ["At level, repeat slowly and mentally, for example: “Every day, in every way, I am getting better, better and better.” “Positive thoughts bring me the benefits and advantages I desire.” “I am always in control.”", "Add one statement of your own in the present tense, about how you want to be.", "During the day, notice phrases such as “I can’t stand this”, “I’m always tired”, “that makes me sick”. Stop, and restate the thought in terms of what you want.", "The recordings also install a protective statement: “Negative thoughts and negative suggestions have no influence over me at any level of the mind.”"],
    tips: ["State what you want, not what you want to avoid. The picture the words create is what counts.", "One or two statements said with feeling do more than a long list."],
    src: [S1 + "02 Positive thinking, positive statements.mp3", S3 + "03 Positive thinking.mp3", S3 + "04 Power of beliefs.mp3"], rel: ["tap-script", "induction"] },

  { id: "mental-screen", cat: "level", name: "The mental screen and memory pegs", time: "5–10 min", week: 3, session: "screen",
    tag: "Where every picture in the method is projected.",
    what: "The mental screen is the area you perceive with eyes closed and turned about 20 degrees upward, sensed as being out in front of you and away from the body. Programming techniques project their images there. Memory pegs are a classic drill for strengthening it.",
    steps: ["Close your eyes and turn them slightly upward. Do not use the eyelids as the screen; sense the screen out in front of you.", "Project a simple, familiar object and concentrate on <b>true colour</b>. A lemon, an orange, a red apple.", "Change it: rotate it, enlarge it, change its colour. Add touch, smell and taste.", "Practise <i>visualisation</i> (recalling something you have seen) and <i>imagination</i> (creating something you have never seen) separately.", "Memory pegs: learn ten number-pictures and run through them on the screen: 1 tea, 2 Noah (a man with a long white beard), 3 May (a calendar), 4 ray (sun rays), 5 law (a police officer), 6 jaw, 7 key (a large gold key), 8 fee (a price tag), 9 bay, 10 toes.", "To remember a list, link each item to its peg in a vivid, absurd picture."],
    why: "The pegs follow the phonetic number system (1 = t, 2 = n, 3 = m, 4 = r, 5 = l, 6 = j, 7 = k, 8 = f, 9 = b, 10 = t+s), so they can be extended. In the course their main job is exercise: projecting them repeatedly builds the faculty that the mirror and three scenes rely on.",
    tips: ["If you do not see clearly, describe the object to yourself and “know” it is there. The UltraMind recordings say sensing counts.", "Colour is the detail the scripts stress most."],
    src: [S1 + "06 Mental screen & memory pegs.mp3", S1X + "04 MENTAL SCREEN & MEMORY PEGS.mp3", S3 + "17 Memory and how to enhance.mp3", S2X + "04 MENTAL:3 SCENES TECHNIQUE.mp3 (opens with the mental screen)"], rel: ["mirror", "three-scenes", "enhanced-awareness"] },

  { id: "golden-light", cat: "level", name: "Golden light body scan", time: "8–10 min", week: 4, session: "golden",
    tag: "A warm light rises from feet to scalp.",
    what: "The relaxation that opens the lucid-dream recordings. It works upward from the feet, uses breath and warmth instead of numbers, and suits lying down.",
    steps: ["Lie down or recline. Breathe in through the nose and out through the mouth a few times, imagining light coming in and tension leaving.", "Feel a warm golden light around the feet, relaxing each toe, the arch, the heel.", "Let it rise: ankles, calves, knees, thighs, hips and lower abdomen.", "Chest, back and spine, shoulders, down the arms to the fingers.", "Neck, jaw, cheeks, eyes, forehead, scalp. You may feel tingling.", "Rest in the whole-body warmth, or go on to hypnagogic imagery."],
    tips: ["Use this at night and the 3-2-1 scan by day, so that one cues sleep and the other cues alert relaxation."],
    src: [L + "l.p.m.s01e02… (WILD meditation, first seven minutes)", L + "l.p.m.s01e01… (MILD meditation, opening relaxation)"], rel: ["hypnagogia", "wild", "long-relax"] },

  /* ---------------- PROGRAMMING ---------------- */
  { id: "laws", cat: "program", name: "Laws of programming and choosing a goal", time: "10 min, once per goal", week: 5,
    tag: "Possible, good for all concerned, helps at least two people.",
    what: "The filter the UltraMind recordings recite before every programming exercise, and the course’s advice on picking goals.",
    steps: ["Write the situation as it is now, in plain facts.", "Write the result you want as a scene you could photograph.", "Check it: would you accept this being done to you? Is it within the possible? Does it make things better? Is it best for everyone concerned? Does it help at least two people?", "If it fails a test, change the goal until it passes. Often this means making it smaller or adding who else benefits.", "Program the <i>end result</i>. Leave the route open."],
    why: "The remote-viewing guidebook warns that goals which are too grand at the start can be an unconscious way of sabotaging yourself. The “two or more people” rule also keeps motivation from being purely self-centred, which the courses say makes programming work better.",
    tips: ["Silva asks you to include your own needs too. Helping others does not mean leaving yourself out."],
    src: [S2 + "02 Developing and maintaining the correct attitude.mp3", S2 + "The Silva Ultramind ESP System.pdf", "SILVA / UltraMind's Remote Viewing & Influencing.pdf (Session 3)"], rel: ["mirror", "three-scenes", "purpose"] },

  { id: "mirror", cat: "program", name: "Mirror of the Mind", time: "8–10 min", week: 5, session: "mirror",
    tag: "Blue frame for the problem, white frame for the solution.",
    what: "The classic Silva problem-solving technique. You look at the problem once in a blue-framed mirror, then replace it with the solution in a white-framed mirror and return only to that.",
    use: "Any situation you want changed: a goal, a habit, a relationship, a fear.",
    steps: ["Enter level one with the 3-to-1 method.", "On your mental screen create a full-length mirror with a <b>blue</b> frame. It can grow to hold a person, a group or a whole scene.", "Project the problem into it and make a good study of it.", "Erase the problem image. Move the mirror to your <b>left</b> and change the frame to <b>white</b>.", "Create the solution image in the white-framed mirror: the situation as you want it, with you in it.", "From then on, whenever you think of the project, see the white-framed solution."],
    why: "Studying the problem once makes the goal concrete. Returning to it would rehearse the problem, so every later session, and every stray thought in the day, goes to the solution.",
    tips: ["For body weight the course adds labels: stamp the target weight in one corner of the white mirror and the clothing size in the other.", "Add feeling. The scripts for rehearsal say to notice how you feel as you succeed; do the same here."],
    traps: ["Going back to the blue frame to “check”. After the first session, glance at it only to note what has changed.", "A vague solution. If you could not photograph it, sharpen it."],
    src: [S1 + "09 Mirror of the mind, solving problems:fears.mp3", S1X + "05 MIRROR OF THE MIND CONDITIONING EXERCISE.mp3", S3 + "14 Mirror of the mind.mp3", "SILVA / Silva Life System Mirror Of The Mind Exercise Silva Method.m4a"], rel: ["three-scenes", "habit", "laws"] },

  { id: "three-scenes", cat: "program", name: "Three Scenes Technique", time: "8–10 min", week: 7, session: "scenes",
    tag: "Problem ahead, change to the left, result further left.",
    what: "The UltraMind version of the mirror. It adds a middle scene in which you act, and it places time in space: the present straight ahead, the future to your left.",
    steps: ["Enter your level.", "<b>Scene 1</b>, directly in front: the problem or present situation. Recall the details and study it. If you have programmed this before, note what has changed since last time.", "<b>Scene 2</b>, about 15° to your left: picture yourself taking action to correct it, and the correction beginning to take place.", "<b>Scene 3</b>, another 15° to the left: the solution. Imagine many people benefiting; the more the better.", "Any time afterwards that you think of the project, visualise scene 3."],
    why: "The recordings teach that in the inner dimension the past is to your right, the present centred and the future to your left. Whatever you make of that, a fixed place for “done” makes the solution image quick to find.",
    tips: ["Scene 2 is the difference from the mirror. Put real steps in it, the ones you intend to take this week.", "A variation in the healing course uses two scenes, present condition and healthy result, for people in medical treatment."],
    src: [S2X + "04 MENTAL:3 SCENES TECHNIQUE.mp3", S2 + "04 Removing impediments to your success.mp3", SH + "BONUS … / Silva's Two Scenes Technique"], rel: ["mirror", "mental-video", "best-time"] },

  { id: "mental-video", cat: "program", name: "Mental Video", time: "8 min at bedtime + 3 days of watching", week: 6,
    tag: "Film the problem, film the solution, hand it over in your sleep.",
    what: "A bedtime technique for getting guidance on a problem. You make two mental films and go to sleep intending to deliver them to what the course calls your tutor or higher intelligence.",
    steps: ["During the day, at ordinary waking level, make a mental video of the problem: what is actually happening.", "In bed, ready for sleep, enter level one.", "Review the problem video once.", "Mentally convert the problem into a <i>project</i>.", "Create a video of the solution with a step-by-step procedure of how you want it resolved.", "Go to sleep intending to deliver the video while you sleep. Take for granted that it will be delivered.", "For the next three days, look for indications that point to the solution: an idea, a remark, a coincidence.", "Whenever you think of the project, think of the solution video in the past tense, as already done."],
    tips: ["Write the indications down. Most are small and easy to dismiss.", "The course uses the same technique nightly for the question “what is my purpose?”"],
    honest: "You do not need to share the course’s belief in a spiritual tutor to use this. Stating a problem clearly, imagining it solved and then sleeping on it is a sound way to get ideas, and looking for clues for three days makes you notice options you would have missed.",
    src: [S2X + "03 MENTAL VIDEO TECHNIQUE.mp3", S2 + "03 Guidance from higher intelligence.mp3", "SILVA / UltraMind's Remote Viewing & Influencing.pdf (Sessions 3–4)"], rel: ["glass-water", "dream-solve", "purpose"] },

  { id: "rehearsal", cat: "program", name: "Mental rehearsal", time: "5–10 min", week: 6, session: "rehearsal",
    tag: "Perform it in your mind, in the place where it will happen.",
    what: "You project yourself to the location of an upcoming activity and run it the way you want it to go, paying attention to how success feels.",
    use: "Sport and movement skills, presentations, interviews, exams, difficult conversations.",
    steps: ["Enter level one.", "Project yourself mentally to the place where you will perform.", "Imagine yourself performing the way you desire, improving and completing the task successfully.", "Notice how you feel as you begin, as you progress, and as you finish with a sense of accomplishment."],
    tips: ["Rehearse from inside your own body, in real time, with the actual movements.", "Include one thing going wrong and yourself recovering smoothly.", "Pair it with physical practice. Imagery adds to training; it does not replace it."],
    src: [S1 + "11 Mental rehearsal technique.mp3", S1X + "07 MENTAL REHEARSAL EXERCISE.mp3", S2X + "05 MENTAL REHEARSAL:BEST TIME TO PRGM:INSTANT RAPPORT TECHNIQUES.mp3"], rel: ["three-fingers", "rapport"] },

  { id: "three-fingers", cat: "program", name: "Three Fingers Technique", time: "Instant, after programming", week: 4,
    tag: "A physical trigger for focus, memory and calm.",
    what: "You join the tips of the thumb and first two fingers of either hand. Programmed at level, the gesture becomes a trigger that, in the course’s words, adjusts the mind to a deeper level of awareness for stronger programming and easier recall.",
    steps: ["<b>Install it:</b> at level, join the three fingers and tell yourself that whenever you do this, your mind adjusts to a deeper level of awareness.", "<b>To study:</b> enter level, tell yourself you will count 1 to 3, open your eyes and read the lesson (name it), with superior concentration and understanding, and that noises will help you concentrate. Read. Then return to level and tell yourself you will recall it at any time with the three fingers.", "<b>For a lecture:</b> same programming beforehand, then keep the fingers together, eyes open, while you listen.", "<b>To store a state</b> (the “alpha anchor” of the Intuition Lifestyle course): at level, imagine a situation that calls for a particular resource such as calm or confidence. See yourself in it with that state, step into the image and feel it fully. Join the fingers and tell yourself: “Whenever I have a need or desire to feel this way, think this way or have this resource, all I need to do is use my three fingers, and it will be so.”", "<b>In an exam, three cycles:</b> first pass, answer what you know and skip the rest. Second pass with the three fingers, staying a little longer on each. Third pass: close your eyes, picture your teacher on the mental screen, ask, clear your mind, then start thinking again and write what comes."],
    tips: ["The healing course fires this same trigger at the peak of every imagery exercise, so that the feeling can be recalled later.", "Reinforce the trigger at level once a week.", "Anchor at the moment the feeling is strongest."],
    src: [S1 + "07 3fingers technique, speed learning, test taking.mp3", S1 + "08 3 FINGERS TECHNIQUE PROGRAMMING.mp3", S3 + "16 Alpha anchor - Trigger mechanism.mp3", S3 + "18 Lifetime learning.mp3"], rel: ["rehearsal", "rapport"] },

  { id: "glass-water", cat: "program", name: "Glass of water technique", time: "2 min at night, 1 min in the morning", week: 6,
    tag: "Half tonight, half tomorrow, and a question in between.",
    what: "A simple ritual for asking for a solution. The question is set while drinking half a glass of water before sleep and closed by drinking the rest on waking.",
    steps: ["Choose one clearly worded problem.", "At bedtime fill a glass with water. Close your eyes, turn them slightly upward, and drink about half while telling yourself mentally: “This is all I need to do to find the solution to the problem I have in mind.”", "Put the glass down and go to sleep.", "On waking, drink the rest in the same way, eyes closed and turned up, repeating the sentence.", "Expect the answer in a dream that night, or as a flash of insight or a coincidence during the following day or days."],
    tips: ["One problem per glass.", "Note what you dreamt and anything during the day that seems to bear on the question."],
    honest: "The water has no special property. The ritual fixes a question in mind at the two moments when you are closest to sleep, which is when the courses say programming takes best.",
    src: [S3 + "13 Glass of water technique.mp3"], rel: ["mental-video", "dream-solve"] },

  { id: "best-time", cat: "program", name: "Best time to program", time: "5 min, in the night", week: 7,
    tag: "Let yourself be woken at the right moment.",
    what: "An UltraMind refinement: you program yourself to wake automatically at the best moment of the night for programming, then do your technique.",
    steps: ["Ready for bed, sit up or sit on the edge of the bed. Close your eyes and turn them up about 20°, lower the head about 20°, and enter your level.", "Tell yourself: “I want to wake up automatically at the best time to program, and I am going to wake up automatically at the best time to program.”", "Stay at level, lie down and go to sleep from level.", "When you wake, in the night or in the morning, sit up, take the same position, enter your level, and do your programming (three scenes, broadcasting, rapport)."],
    tips: ["Keep it short when you wake, five minutes at most, so you can fall asleep again.", "Skip this when you are sleep-deprived."],
    src: [S2X + "05 MENTAL REHEARSAL:BEST TIME TO PRGM:INSTANT RAPPORT TECHNIQUES.mp3", S2X + "07 BEST TIME TO PGM AND BROADCASTING TECHNIQUES.mp3"], rel: ["three-scenes", "broadcasting", "clock"] },

  { id: "habit", cat: "program", name: "Habit control", time: "5–10 min", week: 7,
    tag: "Analyse at level, change in small programmed steps.",
    what: "Silva’s formulas for eating and smoking, which generalise to any habit: study it at level, picture the result in the white-framed mirror, and program gradual changes.",
    steps: ["Enter level and analyse the habit: when, where and why it happens.", "<b>Eating:</b> mentally mark a big red NO over the foods that cause the problem. Program that hunger between meals vanishes with a piece of carrot, celery or apple, or with three deep breaths. Program yourself to leave something on the plate.", "See yourself in the blue-framed mirror as you are; then in the white-framed mirror as you want to be, with weight and clothing size stamped in the corners. Recall the white image whenever you think of weight or sit down to eat.", "<b>Smoking:</b> find when you smoke the first cigarette and program it one hour later; repeat. Or program one per hour on the hour, then only on even hours. Or mark a date 30 days ahead as the day you stop, and reinforce it daily at level.", "Program that three deep breaths stop the immediate urge."],
    tips: ["For another habit, keep the structure: a replacement action for the urge, a gradual schedule, and a white-frame image.", "Attach a reason beyond yourself. The script says: stop for the sake of your loved ones."],
    src: [S1 + "12 Habits.mp3", S1X + "08 WEIGHT & HABIT EXERCISE.mp3", S3 + "15 Habit management.mp3"], rel: ["mirror", "tap-script"] },

  /* ---------------- BODY ---------------- */
  { id: "sleep-control", cat: "body", name: "Sleep control (the chalkboard)", time: "5–15 min, in bed", week: 3, session: "sleep",
    tag: "Circle, X, erase, “deeper”, 100, 99, 98…",
    what: "A formula for falling asleep without medication. A monotonous, slightly fiddly imagined task occupies the mind while each repetition is paired with going deeper.",
    steps: ["In bed, enter level one with 3-2-1.", "Visualise a chalkboard, chalk in one hand, eraser in the other.", "Draw a large circle. Draw a big X inside it.", "Erase the X from the centre outward, taking care not to erase the circle.", "To the right of the circle write the word <b>Deeper</b>.", "Write 100 in the circle. Erase it carefully. Go over the word “Deeper”.", "Continue with 99, 98, 97… until you are asleep."],
    why: "The task is too dull to keep you awake and just demanding enough to keep worries out. “Deeper” is being conditioned as a cue toward sleep.",
    tips: ["Few people get below 80 once the habit is formed.", "The formula includes two reassurances: you will wake at once if someone calls you or there is danger, and you will wake at your usual time."],
    src: [S1 + "04 Sleep control, chalboard xdeeper,100deeper, awake control.mp3", S1X + "02 SLEEP:TO AWAKE:AWAKE CONTROL TECHNIQUES.mp3", S3 + "07 Sleep management.mp3"], rel: ["clock", "dream-recall"] },

  { id: "clock", cat: "body", name: "Clock technique (to-awake control)", time: "2 min, in bed", week: 3,
    tag: "Wake at a chosen time without an alarm.",
    what: "You set an imagined clock at level and sleep from there. The course treats it as a first practical proof of mind control.",
    steps: ["In bed, enter level one.", "Visualise a clock. Move its hands to the time you want to wake.", "Tell yourself: “This is the time I want to awaken, and this is the time I am going to awaken.”", "Stay at level and fall asleep from level."],
    tips: ["Keep a backup alarm a few minutes later until it works three times running.", "Choose a time that gives you a full night."],
    src: [S3 + "08 Clock technique.mp3", S1X + "02 SLEEP:TO AWAKE:AWAKE CONTROL TECHNIQUES.mp3"], rel: ["sleep-control", "best-time", "wbtb"] },

  { id: "awake-control", cat: "body", name: "Awake control (energizing)", time: "2–3 min", week: 4, session: "awake",
    tag: "State it, count 1 to 5, come out alert.",
    what: "A short formula to shake off drowsiness and stay awake longer when you need to.",
    steps: ["If you are driving, pull over and stop the engine first.", "Enter level one.", "Tell yourself: “I am drowsy and sleepy. I don’t want to be drowsy and sleepy. I want to be wide awake, feeling fine and in perfect health.”", "Say you will count 1 to 5 and at 5 open your eyes wide awake, not drowsy.", "Count slowly, repeat the reminder at 3, finish at 5 and affirm it with eyes open."],
    tips: ["The same pattern, “I have X, I don’t want X, at five I will be Y”, is reused for headaches.", "It buys time. It is not a replacement for sleep."],
    src: [S3 + "09 Energizing technique.mp3", S1 + "04 Sleep control, chalboard xdeeper,100deeper, awake control.mp3"], rel: ["count-out", "headache"] },

  { id: "headache", cat: "body", name: "Headache control", time: "2 min (tension) · 3 × 2 min (migraine)", week: 7,
    tag: "Name it, refuse it, count out without it.",
    what: "A formula that uses the count out to leave a headache behind. One application for tension headaches; three applications five minutes apart for migraine.",
    steps: ["Enter level one.", "Tell yourself: “I have a headache; I feel a headache. I don’t want to have a headache; I don’t want to feel a headache.”", "“I am going to count from 1 to 5, and at 5 I will open my eyes, wide awake, feeling fine. I will then have no headache.”", "Count 1, 2, 3. At 3 remind yourself: “at 5 I will have no <i>discomfort</i> in my head.” The word changes from ache to discomfort on purpose.", "Count 4, 5, open your eyes and affirm: “I have no discomfort in my head. And this is so.”", "Migraine: repeat three times, five minutes apart. Each application takes away part of it."],
    honest: "Tension headaches often respond to relaxation, so this is worth trying. The book itself adds that controls for health problems are applied under a doctor’s supervision. New, severe or changing headaches need a medical check, not a formula.",
    src: [S1 + "05 Dream control and headache control techniques.mp3", S1X + "03 DREAM:HEADACHE CONTROL CONDITIONING EXERCISE.mp3", S3 + "12 Headache management.mp3", S3 + "11 Pain self management.mp3"], rel: ["glove", "awake-control"] },

  { id: "hand-levitation", cat: "body", name: "Hand levitation", time: "8 min", week: 7,
    tag: "A deepening method you can watch working.",
    what: "With eyes open, you let your stronger hand become light and rise to your face during a 10-to-1 count. When it touches, you close your eyes and are at a deeper level than usual.",
    steps: ["Sit upright with room to raise your arm, hands palms-down on your lap. Keep your eyes open and on your stronger hand.", "<b>10:</b> look at the hand. <b>9:</b> make it feel very sensitive; cause one finger to move, then the fingers to separate, and the hand to start rising.", "<b>8–5:</b> let hand and arm become lighter and lighter, as if lifted by a balloon, rising toward the face past the halfway point.", "<b>4–2:</b> higher and lighter, very near the face.", "<b>1:</b> the back of the hand touches your face. Close your eyes, take a deep breath, and as you exhale return the hand to your lap.", "Deepen with 10 to 1 and continue with your practice."],
    why: "You start the movement deliberately and then allow it. Watching your own hand respond to an idea is persuasive, and the courses use it as the doorway to the pain-control work.",
    tips: ["Let it be slow. A full minute or two for the rise is normal.", "If it stalls, help it a little and let go again."],
    src: [S1 + "10 Hand levitation (relax) & Glove anesthesia (healing).mp3", S1X + "06 HAND LEVITATION & GLOVE ANESTHESIA CONDITIONING EXERCISE.mp3", BOOK + " (Appendix D)"], rel: ["glove", "deepening"] },

  { id: "glove", cat: "body", name: "Glove anaesthesia", time: "10 min", week: 7,
    tag: "Make one hand cold and numb, then move the feeling.",
    what: "Pain-control training. You develop a sensation in your weaker hand that is different from normal, coolness, tingling or numbness, and then learn to transfer it.",
    steps: ["Enter level (hand levitation works well).", "Imagine placing your <b>stronger</b> hand in a container of hot water. Recall a real time you did this. Take it out and rest it.", "Imagine placing your <b>other</b> hand in ice water with cracked ice. Recall a real memory. Feel the ice between your fingers; let the hand grow colder.", "While it cools, occupy your mind with the ten memory pegs on your mental screen.", "Lift the cold hand and hold it above and behind your head without touching, letting it dry and get colder.", "Bring it down and test it with the other hand for coldness and reduced feeling.", "Remove the effect: rub the hand three times from wrist to fingertips with the other hand.", "With practice: place the anaesthetised hand on the other hand for a few seconds to transfer the feeling, then onto any part of the body. Eventually, concentrate on a discomfort and say mentally “gone”."],
    tips: ["Any sensation that differs from normal counts: cool, tingling, wooden, gloved, absent.", "Always restore normal feeling at the end."],
    honest: "Suggested numbness is a real and well-known effect of deep relaxation, and it varies widely between people. Pain is information. Use this for discomfort you already understand, and see a doctor for pain you do not.",
    src: [S1 + "10 Hand levitation (relax) & Glove anesthesia (healing).mp3", S1X + "06 HAND LEVITATION & GLOVE ANESTHESIA CONDITIONING EXERCISE.mp3", S3 + "11 Pain self management.mp3"], rel: ["hand-levitation", "headache"] },

  { id: "health-image", cat: "body", name: "Ideal health image (and the healing scenes)", time: "10–20 min", week: 7,
    tag: "Shrink the old picture, step into the healthy one, anchor it.",
    what: "The central exercise of the Mind Body Healing course. You look honestly at your present state of health once, let that picture shrink away, and replace it with a vivid image of yourself in full health that you step into and anchor with your trigger.",
    use: "As a daily support for recovery, energy or fitness goals, alongside whatever medical care you are receiving.",
    steps: ["Enter level and deepen. Relax each part of the body, imagining its tissues working in a normal, healthy, rhythmic way.", "On the mental screen, project yourself as you are now in the area of health, small and in <b>grey tones</b>. Study it honestly: which thoughts, beliefs and habits keep it in place?", "Let that image get smaller and smaller until it <b>poofs</b> away.", "Bring in a new image, <b>colourful and dynamic</b>: you in excellent health. Describe it to yourself: posture, skin, eyes, energy, how you move, what you are wearing.", "Layer onto it mental, emotional and spiritual wellbeing; watch the image grow richer.", "Make it bigger, let it come toward you and <b>wrap around you</b> until you are inside it. Feel it. Hear what people say about how well you look. Notice what evidence tells you it is real.", "Use your three-fingers trigger: “Whenever I need to feel this way, all I need to do is use my trigger, and it will be so.”", "Project it forward one, five, ten years. Finish with a strong feeling of gratitude, and experience it as already done. From now on, when you think of your health, think of this image."],
    extra: '<div class="note"><b>Healing scenes for people in treatment.</b> A variation uses the three scenes: the present condition (once); then the correction, your treatment or procedure, working well and giving measurable signs of progress; then yourself fully well, stepped into and anchored. On later sessions use only the correction scene and the result scene, until you get real, measurable feedback.</div>',
    tips: ["“Breathe deeply, slowly, consciously and rhythmically” runs through the whole course. Keep that breath going.", "The Health Booster recording combines a long body relaxation with this image and is the best single track to start with."],
    honest: "Calm, hopeful imagery can ease stress, pain and the experience of treatment, and it helps people stick to healthy habits. It does not cure disease. The course’s sales text claims far more than that; the book’s own rule is the one to follow: health applications are done under a doctor’s supervision.",
    src: [SH + "BONUS … / Health Booster / 04 Health Booster exercise.mp3", SH + "BONUS … / Silva's Two Scenes Technique / two_scenes_exercise_track_02.mp3", SH + "Module 11 / cd_11_track_03.mp3", SH + "06 MEDITATION 01.mp3"], rel: ["three-scenes", "three-fingers", "glove"] },

  /* ---------------- TAPPING ---------------- */
  { id: "tap-points", cat: "tap", name: "The tapping sequence", time: "3–6 min", week: 5, session: "tap",
    tag: "Side of the hand, then eight points from eyebrow to crown.",
    what: "Tapping (EFT) means saying a troubling thought aloud while tapping lightly with two fingers on a fixed series of points. The videos in your library follow the standard sequence and ask you to repeat each phrase after the presenter.",
    steps: ["Name the issue and rate how strong it feels, 0 to 10.", "<b>Setup:</b> tap the side of the hand (the “karate chop” point) and say the setup statement three times: “Even though [the problem], I deeply and completely love and accept myself.”", "Tap about five to seven times on each point while saying one short phrase per point.", "After a round or two, take a deep breath in and let it out, “releasing the old energy”. Breathe again.", "Rate the feeling again. Repeat on what remains."],
    extra: '<ul class="pts"><li><b>Side of hand</b><br>Fleshy edge below the little finger. Setup only.</li><li><b>1 · Eyebrow</b><br>Inner end of the eyebrow (“inside of the eye”).</li><li><b>2 · Side of eye</b><br>On the bone at the outer corner.</li><li><b>3 · Under eye</b><br>On the bone below the pupil.</li><li><b>4 · Under nose</b><br>Between nose and upper lip.</li><li><b>5 · Chin</b><br>The crease below the lower lip.</li><li><b>6 · Collarbone</b><br>Just below the knob of the collarbone.</li><li><b>7 · Under arm</b><br>About a hand’s width below the armpit.</li><li><b>8 · Top of head</b><br>The crown.</li></ul>',
    tips: ["Use either hand and either side. Firm enough to feel, never painful.", "Say the words aloud if you can. Honest wording matters more than the exact point."],
    honest: "Some studies find tapping lowers anxiety; whether the points add anything beyond saying a fear aloud while calming yourself is disputed. That combination is useful either way.",
    src: ["EFT ABUNDANCE 21D - 100K / Tapping only / 01.mp4 – 21.mp4", "EFT ABUNDANCE 21D - 100K / 100K / 100K 01–05.mp4"], rel: ["tap-script", "tap-21", "tap-goal"] },

  { id: "tap-script", cat: "tap", name: "Writing a tapping script", time: "5 min to write, 6 min to tap", week: 6,
    tag: "Accept it, voice it, question it, choose.",
    what: "Every video in the series has the same four-part shape. Once you see it you can write a script for any block.",
    steps: ["<b>Accept.</b> Setup statement, three times, with the block in your own blunt words: “Even though I feel stressed and anxious whenever I think about money, I deeply and completely love and accept who I am and how I feel right now.”", "<b>Voice it.</b> One or two rounds stating the negative as it feels, with no softening: “There’s never enough.” “I’m not good enough.” “All the evidence I have is of lack.”", "<b>Question it.</b> A pivot round of “what if”: “What if I got it wrong? What if that’s just a story? What if they were wrong all along?”", "<b>Choose.</b> Rounds of “I choose…”, “I’m open to…”, “I give myself permission to…”: the belief you prefer, in words you can almost believe.", "Two deep breaths. Re-rate. Note the number."],
    why: "Starting with the negative is deliberate. Affirmations laid over an unspoken objection tend to bounce off; here the objection is spoken and accepted first, and the positive comes in through a question.",
    tips: ['Use the <a href="#/tap">script builder</a> to lay out your rounds.', "“Choose” and “open to” are easier to say truthfully than “I am”.", "If the number does not move, get more specific: a particular memory, person or bill."],
    src: ["EFT ABUNDANCE 21D - 100K / Tapping only / 03.mp4 (stress about money)", "… / 11.mp4 (deserving)", "… / 14.mp4 (spiritual versus wealthy)"], rel: ["tap-points", "statements"] },

  { id: "tap-21", cat: "tap", name: "The 21-day abundance sequence", time: "4–9 min a day", week: 8,
    tag: "Twenty-one themes, from resistance to gratitude.",
    what: "The “Tapping only” folder is a three-week course. Each day takes one belief about money and worth. Some days clear a negative, some install a positive, and the order matters.",
    steps: ["Do one video a day, in order, repeating the phrases aloud while tapping.", "Before pressing play, rate how true the day’s negative feels for you. Re-rate afterwards.", "If a day hits hard, repeat it the next day before moving on."],
    extra: '<div class="scroll"><table><thead><tr><th>Days</th><th>Themes</th></tr></thead><tbody>' +
      '<tr><td>1–2</td><td>Lifelong resistance to abundance → opening to it (“I was born abundant”)</td></tr>' +
      '<tr><td>3</td><td>Stress and anxiety about money; the “evidence” of lack</td></tr>' +
      '<tr><td>4</td><td>Releasing conditioning; reconnecting with your own capability</td></tr>' +
      '<tr><td>5</td><td>Shame, anger and overwhelm about debt → becoming solution-focused</td></tr>' +
      '<tr><td>6–7</td><td>Acknowledging blocks and “transmuting” them; switching from no to yes</td></tr>' +
      '<tr><td>8</td><td>Two parts: fear of failure and powerlessness, then stepping into your power</td></tr>' +
      '<tr><td>9–10</td><td>Abundance as a birthright; a playful gratitude refrain when a bill arrives</td></tr>' +
      '<tr><td>11–12</td><td>“I don’t deserve it” → permission to have and receive</td></tr>' +
      '<tr><td>13</td><td>Gratitude in advance</td></tr>' +
      '<tr><td>14–15</td><td>The conflict “you can’t be spiritual and wealthy” → wealth used to live your mission and help others</td></tr>' +
      '<tr><td>16–21</td><td>Consolidation of the same ground: receiving, worth, trust and gratitude</td></tr></tbody></table></div>',
    tips: ["Week 8 of the program compresses this into seven days. Do the full 21 afterwards if tapping suits you.", "Swap “abundance” for your actual goal whenever the word feels abstract."],
    honest: "The series speaks of the universe delivering wealth. Take from it what it reliably does: it surfaces beliefs such as “I don’t deserve it” that quietly limit what you attempt. Money follows from what you then do.",
    src: ["EFT ABUNDANCE 21D - 100K / Tapping only / 01.mp4 … 21.mp4"], rel: ["tap-script", "induction"] },

  { id: "tap-goal", cat: "tap", name: "Tapping on a stretch goal (the 100K arc)", time: "4–6 min a day for 5 days", week: 5,
    tag: "Impossible → undeserving → open → action → trust.",
    what: "A five-part series built around one outrageous target. Each part meets the next objection the mind raises. The arc works for any ambitious goal.",
    steps: ["<b>Day 1 · “It seems impossible.”</b> Say how ridiculous the goal sounds. Then: “I’m open to releasing the beliefs that tell me I can’t. What if it is possible?”", "<b>Day 2 · “I don’t deserve it.”</b> “I haven’t earned it; I’m not enough.” Then: “What if I don’t have to earn worthiness? I choose to know I was born deserving.”", "<b>Day 3 · Open to receive.</b> “I’m open to it arriving from multiple sources, with ease. I’m open to all the opportunities and possibilities.”", "<b>Day 4 · Action.</b> “I’m committed to acting on the inspiration I receive. Big results take big energy. I’m willing to do my due diligence and risk assessment.”", "<b>Day 5 · Trust.</b> “I don’t know how, and I trust it is unfolding. I relax and allow.”"],
    tips: ["Use your own goal and your own number.", "Day 4 is the one that changes outcomes. Write down one action each time you finish it."],
    honest: "No technique can promise a sum of money by a date, and you should be wary of anyone who does. Used on a goal you are also working toward, the arc is a good way to notice which objection, impossibility, worth, receiving, effort or trust, is the one stopping you.",
    src: ["EFT ABUNDANCE 21D - 100K / 100K / 100K 01.mp4 – 100K 05.mp4"], rel: ["tap-script", "laws", "mirror"] },

  { id: "induction", cat: "tap", name: "Belief inductions (language loops)", time: "5 or 20 min", week: 8,
    tag: "One strange, open question, repeated while you are relaxed.",
    what: "The six recordings in the IL folder call themselves “mind-bending language loops”. Each relaxes you briefly, then repeats a single long, deliberately tangled question aimed at one block to abundance. You are not meant to answer it. Trying to follow it loosens the fixed way you think about the subject.",
    use: "After tapping, or on its own when one of the six blocks is clearly yours. The 5-minute loop is the daily dose; the 20-minute loop is the same question for a deeper session.",
    steps: ["Pick the block that fits (table below). Sit comfortably, eyes closed. Never while driving.", "Breathe and relax; let the background sound focus your attention inward. Being at level makes it stronger.", "Let the question be asked again and again. Consider it; do not force an answer. Notice images, memories and feelings that surface.", "At the end, come back slowly: breathing, hands and feet, a stretch, eyes open.", "Write down anything that occurred to you, and one action if there is one."],
    extra: '<div class="scroll"><table><thead><tr><th>#</th><th>The block</th><th>What the loop asks, in plain words</th></tr></thead><tbody>' +
      '<tr><td>1</td><td>Ignoring the knock on the door</td><td>Who are you, that is worth more than everything you have so far considered, and deserves it now?</td></tr>' +
      '<tr><td>2</td><td>Preferring to be right than rich</td><td>Recall a time you insisted on being right and lost the moment. Are you secure enough in being right to let others be “less than wrong” when it is not critical?</td></tr>' +
      '<tr><td>3</td><td>Refusing to stretch your dreams</td><td>Beyond what you think you want, what else would be far more rewarding, the essence inside each goal?</td></tr>' +
      '<tr><td>4</td><td>A thin inner blueprint</td><td>Given all you are and all you think you can be, what else did you think you were not, that is more than all of this?</td></tr>' +
      '<tr><td>5</td><td>Walking around with your eyes shut</td><td>Consider your whole goal until you notice there is more in it, and around it, than you thought: unexpected opportunity, everywhere.</td></tr>' +
      '<tr><td>6</td><td>Needing to take more action</td><td>Aside from everything not yet done, what is the one thing you can do now, not later, to get one step closer?</td></tr></tbody></table></div>',
    why: "The sentences are built so that the mind cannot settle on one meaning. It is a hypnotic-language device: while you search for sense, the embedded suggestions (you are worth more, there is more, start now) meet less resistance.",
    tips: ["Without the audio: go to level, read the plain-words question once, close your eyes and turn it over for five minutes.", "Loop 6 pairs naturally with day 4 of the stretch-goal tapping arc.", "One loop a day. They are meant to work in the background afterwards."],
    honest: "These are suggestion recordings. Their realistic effect is a shift in how you look at a goal, and the test of that is whether you do something different afterwards.",
    src: ["IL Abundance Inductions / 01 … 06 / 5 Minute Loop", "IL Abundance Inductions / 01 … 06 / 20 Minute Loop"], rel: ["tap-21", "statements", "tap-goal"] },

  /* ---------------- DREAMS ---------------- */
  { id: "dream-recall", cat: "dream", name: "Dream recall (dream control, steps 1–2)", time: "2 min at night, 3 min on waking", week: 4, session: "dreamset",
    tag: "First one dream, then all of them.",
    what: "Silva’s dream control begins with memory. You program yourself at level to remember a dream, and you write it down at once.",
    steps: ["Put paper and pen, or this journal, within reach.", "In bed, enter level one.", "<b>Step 1:</b> tell yourself, “I want to remember a dream, and I am going to remember a dream.” Go to sleep from level.", "When you wake, in the night or the morning, write the dream down immediately.", "When step 1 works reliably, move to <b>step 2:</b> “I want to remember my dreams, and I am going to remember my dreams.” Expect to wake several times with clear recollections."],
    tips: ["On waking, do not move and do not open your eyes. Ask what you were just doing and let the scene come back, then write.", "Write in the present tense and give each dream a title.", "Fragments and feelings count."],
    src: [S1 + "05 Dream control and headache control techniques.mp3", S1X + "03 DREAM:HEADACHE CONTROL CONDITIONING EXERCISE.mp3", S3 + "10 Dream control.mp3"], rel: ["dream-solve", "mild", "reality-check"] },

  { id: "dream-solve", cat: "dream", name: "Problem-solving dreams (dream control, step 3)", time: "3 min at night", week: 8,
    tag: "Ask for a dream that contains the answer.",
    what: "Once recall is steady, you ask for a dream on a specific problem, and for the ability to remember and understand it.",
    steps: ["Enter level one in bed.", "Tell yourself: “I want to have a dream that will contain information to solve the problem I have in mind.” State the problem.", "Add: “I will have such a dream, remember it, and understand it.”", "Sleep from level.", "On waking, write the dream, then ask at level what it means in relation to your question."],
    tips: ["Dreams answer in images and puns. Ask what the main image reminds you of.", "Combine it with the glass of water on the same night."],
    honest: "Dream incubation is an old and reasonable practice: you prime a question and harvest associations. Treat what comes as ideas to examine, not instructions.",
    src: [S1 + "05 Dream control and headache control techniques.mp3", S3 + "10 Dream control.mp3"], rel: ["dream-recall", "glass-water", "mental-video"] },

  { id: "reality-check", cat: "dream", name: "Reality checks and dream signs", time: "10 × 15 s through the day", week: 9,
    tag: "Ask “am I dreaming?” and mean it.",
    what: "A daytime habit that carries over into dreams. You question your state several times a day with a simple test; eventually you do it in a dream, the test fails, and you become lucid.",
    steps: ["Read your dream journal and list your <b>dream signs</b>: recurring places, people, themes or oddities.", "Ten times a day, and whenever something odd happens or a dream sign appears, stop and sincerely ask: “Am I dreaming?”", "Test it. Look at the palms of your hands, or try to push a finger through your palm: the two checks suggested in the MILD recording. Or pinch your nose and try to breathe in, the check used in the narrated dreams. Or read some text, look away and look back.", "Look around for anything out of place, and recall how you got here.", "Conclude out loud or mentally: “I am awake” or “this is a dream”."],
    tips: ["Tie checks to triggers: doorways, your phone, your hands.", "A check done on autopilot will be done on autopilot in the dream. Take five real seconds."],
    src: [L + "l.p.m.s01e01… (dream signs and the palm check)", L + "l.p.m.s01e04… (nose-pinch check inside a narrated dream)"], rel: ["mild", "stabilize", "dream-recall", "incubation"] },

  { id: "mild", cat: "dream", name: "MILD: remembering to recognise the dream", time: "5–10 min as you fall asleep", week: 9, session: "dreamset",
    tag: "Rehearse a dream and set the intention to notice next time.",
    what: "Mnemonic induction of lucid dreams, developed by Stephen LaBerge. It uses the kind of memory that lets you remember to do something later.",
    steps: ["As you fall asleep, or better after waking from a dream in the night, recall a recent dream in detail.", "Find a dream sign in it, something that should have told you it was a dream.", "Replay the dream in imagination, but this time notice the sign and become lucid. Carry on as you would like to.", "Repeat with full intention: “Next time I am dreaming, I will remember that I am dreaming.”", "Keep that the last thing in your mind as you fall asleep."],
    tips: ["Most effective combined with wake-back-to-bed.", "The guided MILD recording adds one step first: choose a recurring dream sign and decide that the next time you see it you will become lucid.", "Plan the dream in advance: what you will see, whom you will meet, how you will fly. Next time you are lucid you will have a plan."],
    src: [L + "l.p.m.s01e01… (guided MILD, then affirmations to fall asleep to)"], rel: ["wbtb", "reality-check", "incubation", "wild"] },

  { id: "incubation", cat: "dream", name: "Sleep talk-down and dream incubation", time: "15–40 min, falling asleep", week: 9, session: "incubate",
    tag: "Settle the mind, then rehearse the lucid dream you want.",
    what: "Two of the lucid-dream recordings pair a “sleep talk-down” with a narrated dream. First the mind is quietened; then, on the edge of sleep, you follow a story in which you notice you are dreaming, test it, steady the scene and try something. The images are meant to resurface later in the night.",
    steps: ["Lie down in the position you sleep in. Lights off.", "<b>Talk-down.</b> Rest attention on the breath wherever you feel it most. Label it softly, “in, out”, or count breaths. When a thought arises, notice it arise and fall away, and return without scolding yourself.", "Optional <b>reverse psychology</b> from one recording: keep your eyes open and let yourself stay awake for the first ten minutes. Trying to stay awake often makes sleep come faster once you close them.", "Look at your visual field behind closed eyes: darkness, colour, perhaps early imagery.", "<b>Incubation.</b> Imagine arriving somewhere unfamiliar. Ask: <i>Where am I? How did I get here?</i> Find you cannot answer. Think: <i>maybe I am dreaming.</i>", "Do the nose-pinch check: pinch your nose and breathe in. You can. Say “I’m dreaming.”", "Ground yourself: touch a surface, feel its texture. Check that you remember your name and where you live; the recording calls this a high level of lucidity.", "Do something small, then something bigger. In the recording: make a pebble vanish behind your hand, move a boulder with a blink, then lift it into the air. Confidence grows by steps.", "Remind yourself “I’m dreaming” as you go. Let yourself fall asleep at any point; do not wait for the end."],
    why: "It is MILD in story form. Rehearsing the exact sequence, doubt, test, stabilise, act, makes each step more likely to happen by itself when a real dream offers the chance.",
    tips: ["Write your own script around your dream signs and the thing you most want to try.", "The other narrated dream is set in the empty space between dreams. Its lesson: if a scene dissolves into a void, stay calm, rub the ground, expect a new scene, and walk through the door when it appears."],
    src: [L + "l.p.m.s01e04… (talk-down with eyes open; incubation: levitation)", L + "l.p.m.s01e05… (breath talk-down; incubation: the place between dreams)"], rel: ["mild", "stabilize", "reality-check"] },

  { id: "wbtb", cat: "dream", name: "Wake-back-to-bed", time: "15–30 min awake after ~5 h sleep", week: 9,
    tag: "Aim your attempt at the dream-rich end of the night.",
    what: "Dream periods grow longer toward morning. You sleep about five hours, wake briefly, then return to sleep with a lucid-dream technique.",
    steps: ["Set an alarm for about five hours after you fall asleep, or use the clock technique.", "Get up for 15 to 30 minutes. Keep the lights low. Read your dream journal or about lucid dreaming.", "Return to bed and use MILD, or start a WILD recording.", "Sleep as long as you can afterwards."],
    tips: ["Weekends only, to begin with.", "The WILD recording in your library says it can be used at a nap, at bedtime, or five hours into the night; the last is the most effective."],
    traps: ["Staying up so long or so brightly that you cannot fall asleep again.", "Doing it every night. Two nights a week is plenty."],
    src: [L + "l.p.m.s01e01… (suggests replaying the affirmation section after five hours)", L + "l.p.m.s01e02… (WILD meditation introduction)"], rel: ["mild", "wild", "clock"] },

  { id: "hypnagogia", cat: "dream", name: "Hypnagogic imagery", time: "10–15 min", week: 10, session: "golden",
    tag: "Watch the pictures that come before sleep.",
    what: "Between waking and sleep, images appear spontaneously: dots, colours, tunnels, faces, landscapes. Learning to watch them calmly is the core skill for entering a dream consciously.",
    steps: ["Relax fully with the golden light body scan.", "Look into the darkness behind your eyelids, into the distance.", "Notice whatever appears: a point, a glow, a tunnel. Travel into it with your gaze.", "Let shapes morph. Allow the mind to “let go and co-create”: neither force nor follow a train of thought.", "When the imagery becomes scene-like, you are at the threshold. Either rest there or continue into WILD."],
    tips: ["A count from 10 to 1 with the suggestion that the imagery will increase is used in the recording, and it helps.", "If you keep falling asleep, try sitting slightly reclined, or do it at a nap."],
    src: [L + "l.p.m.s01e02… (minutes 7–12)", L + "l.p.m.s01e05… (watching the visual field during the talk-down)"], rel: ["wild", "golden-light", "deepening"] },

  { id: "wild", cat: "dream", name: "WILD: wake-initiated lucid dream", time: "20–40 min", week: 10, session: "wild",
    tag: "Keep the mind awake while the body falls asleep.",
    what: "You pass from waking directly into a dream without losing awareness. The guided version in your library relaxes the body, opens the hypnagogic imagery, has you build a dream scene, and then lets affirmations run as you cross over.",
    steps: ["Choose your moment: a nap, bedtime, or best, after five hours of sleep.", "Relax completely (golden light).", "Watch the hypnagogic imagery. Count 10 to 1 to let it strengthen.", "Begin to shape it into the dream you want: imagine the sights, smells, tastes and touch, and feel the emotions as if it were happening now. Know why you want this dream.", "Stay lightly busy creating the scene so that you do not slip into unconscious sleep, while the body goes to sleep by itself.", "At some point the scene surrounds you and has depth. You are in. Move into it."],
    tips: ["The balance is delicate: too much effort keeps you awake, too little and you are gone. Expect many near misses.", "Sensations of heaviness, vibration, floating or being unable to move mean the body is asleep. Stay calm and stay with the scene."],
    honest: "WILD is the hardest lucid-dream method and many skilled lucid dreamers rarely manage it. MILD with wake-back-to-bed is the reliable route; treat WILD as an advanced experiment.",
    src: [L + "l.p.m.s01e02… (guided WILD, two hours with repeating affirmations)"], rel: ["hypnagogia", "trapdoor", "wbtb", "stabilize"] },

  { id: "trapdoor", cat: "dream", name: "The trapdoor (sinking entry)", time: "20–40 min", week: 10,
    tag: "Grow heavy, sink through the bed, open the door underneath.",
    what: "A guided way into a dream that uses the heaviness of the falling-asleep body. You memorise your room, grow heavier with a countdown, sink through the mattress and dive through a trapdoor into a landscape. It is an easier-to-picture alternative to the scene-building in WILD.",
    steps: ["Lie on your back, arms at your sides, palms down. Without moving your head, look around the room. Close your eyes and follow the breath. Open them and study one object; close them. Repeat once more, then keep them closed.", "Let a wave of relaxation rise from the feet to the scalp. Feel the head sink into the pillow.", "Imagine a trapdoor in the floor under your bed that opens onto another world: tall grass, trees, birdsong, a warm breeze. Make it as real as the room you just looked at.", "Count 10 to 1, becoming heavier on each number, and begin to sink through the bed until you reach the floor.", "Turn to face the door. Open it; warm golden light on your face. Dive through as into water, and fly over the landscape.", "Land. If things are hazy, declare “clarity now”. Do a reality check. Pick up a stone or a stick and feel its texture to make the scene solid.", "Explore while the affirmations, or your own, carry you into sleep."],
    tips: ["Opening and closing the eyes at the start gives you a fresh memory of the room, which makes “sinking out of it” more convincing.", "If you roll over and fall asleep halfway, that is fine. The imagery still seeds the night’s dreams."],
    src: [L + "l.p.m.s01e03… (guided trapdoor meditation, then lucidity and sleep affirmations)"], rel: ["wild", "hypnagogia", "stabilize"] },

  { id: "stabilize", cat: "dream", name: "Staying lucid", time: "The first ten seconds", week: 9,
    tag: "Calm down, touch something, state your intention.",
    what: "Most first lucid dreams end within seconds from excitement. A short routine keeps the dream going.",
    steps: ["Stay calm. Say to yourself, “this is a dream”, quietly.", "Rub your hands together or touch a surface, and look closely at its detail. You can also say a command aloud, as the MILD recording suggests: “Stability now” or “I am grounded.”", "If the scene fades into a void, stay calm, kneel and rub the ground, and expect a new scene to form. It usually does within a minute or two.", "State what you intend to do, then do it. Have one plan ready before you sleep.", "On waking, lie still and record it at once."],
    tips: ["Good first plans: fly a short distance, ask a dream figure a question, rehearse a skill.", "Ways to fly, from the recording: jump upward, use a swimming motion, or simply command “fly now”.", "Keep emotion level. One narrated dream reminds you not to let excitement get the better of you."],
    src: [L + "l.p.m.s01e01… (stability commands, flying)", L + "l.p.m.s01e05… (the void between dreams)", L + "l.p.m.s01e04… (starting small, then scaling up)"], rel: ["reality-check", "mild"] },

  /* ---------------- INTUITION ---------------- */
  { id: "enhanced-awareness", cat: "esp", name: "Enhanced awareness (projection into objects)", time: "12–15 min", week: 11,
    tag: "A garden, a flower, a room, and the inside of things.",
    what: "An imagination exercise that sharpens every sense and introduces “projection”: imagining yourself inside an object and testing what it is like there.",
    steps: ["Enter your level.", "At a count of three, project yourself to a <b>garden</b>. Look around.", "Pick a flower. Hold it at arm’s length: feel, size, shape, colour. Bring it close. Smell it.", "Touch your forehead and project yourself <b>into the flower</b>. Test for light, temperature, odour, and solidity, by knocking on the inside with your fist and listening.", "Touch your forehead and come out. Set the flower aside.", "Listen: the softest sound in the garden, then the loudest. Feel the temperature, the ground, your clothing. Pick a fruit and taste it.", "At a count of three, project to a <b>room you know well</b>. Notice what is in front, to each side and behind. Pick up a small object, examine it, project into it, make the same four tests, and come out.", "Notice the sounds and smells of the room and the contact of your body with the furniture. Count out."],
    why: "The course presents this as training to use your senses more fully so that you find more options when solving problems. It is also the first step of the Silva case-working sequence, which goes on to metals, plants, animals and people.",
    tips: ["Use your physical hand for the gestures, as the recording directs. It anchors the imagery.", "Afterwards, check one detail of the real room against what you imagined."],
    src: [S2X + "08 ENHANCED AWARENESS EXERCISE.mp3", S2 + "08 Finding your purpose in life thru developing yur psychic ability.mp3", S3 + "05 Your inner potential.mp3"], rel: ["mental-screen", "psychometry", "remote-viewing"] },

  { id: "mentor", cat: "esp", name: "Mental mentor, laboratory and counsellors", time: "10–15 min", week: 11,
    tag: "An inner workplace and advisers you can consult.",
    what: "Three related tools. The mental mentor is an imagined copy of a teacher you admire. The laboratory is an inner room equipped for problem solving. The counsellors are two advisers you meet there.",
    steps: ["<b>Mental mentor.</b> At level, think of someone who taught and guided you. Project them on the mental screen: height, features, hair, the way they move and talk.", "Imagine the figure stepping away from the screen and becoming fully alive. From now on you can talk with them, ask how they would handle something, and let them encourage you while you perform.", "<b>Laboratory.</b> Enter level, then count 10 to 1 to reach a deeper, “creative” level. Create a room of any size, shape and colours you like, leaving one wall blank.", "Furnish it one item at a time, declaring each “an accomplished fact”: an armchair, a desk, a clock, a perpetual calendar that can show any past, present or future date, an information system holding information for solving problems of all kinds, and tools, instruments and remedies of every sort.", "<b>Counsellors.</b> Seated in your chair, imagine a compartment whose door slides down a few inches at a time. Reveal your first counsellor slowly: hair, forehead, face, shoulders, then the whole figure. If nothing appears by itself, create it. The figure steps out fully alive; greet them and ask their name. Repeat for the second. The recording introduces a man and a woman, each “a genius in every field”.", "<b>Routine.</b> To work: 3 to 1, then 10 to 1 to the laboratory. Greet your counsellors, state the problem, ask, and wait quietly. Thank them, then come out counting 1 to 10 and 1 to 3, or fall asleep from there at night.", "The recording closes by projecting blue-white light with your counsellors toward someone who needs support, then forming a circle of energy and placing yourself, and finally the Earth, at its centre."],
    tips: ["Keep the laboratory the same from visit to visit.", "Answers often arrive as a phrase or image just after you stop trying."],
    honest: "Consulting an imagined adviser is a recognised way to reach what you already know but have not put into words. The courses also describe counsellors in spiritual terms; either reading lets you use the technique.",
    src: [S1 + "13 Call on Expert help whenever you need it.mp3", S1X + "09 MENTAL MENTOR CONDITIONING EXERCISE.mp3", S3 + "19 Laboratory.mp3", S3 + "20 Counselors.mp3"], rel: ["mental-video", "purpose"] },

  { id: "psychometry", cat: "esp", name: "Psychometry, pendulum and dowsing", time: "10 min", week: 11,
    tag: "Holding an object and asking about its owner.",
    what: "The UltraMind course teaches that objects carry impressions of people who have handled them, and that you can also store an intention in an object. It adds the pendulum and dowsing rods as ways to get yes/no answers.",
    steps: ["Take an object that has been in someone’s possession. Hold it in your left hand.", "Enter your level and decide what you are asking about: physical, mental or emotional.", "Relax and think about the person. Ask a question.", "Clear your mind for a moment, then “start thinking again” and take the first impression that comes.", "<b>Programming an object:</b> the workbook suggests choosing an object linked to a habit you want to change and stating into it, at level, the change you want, so that it reminds you each time you touch it.", "<b>Pendulum:</b> hold it loosely, enter level, decide which swing means yes and which no, ask, and watch."],
    tips: ["Test with objects from people you can check with afterwards, and write your impressions down before asking them."],
    honest: "Controlled tests have not shown that objects transmit information, and pendulum movement is produced by tiny unconscious muscle movements of your own. That makes a pendulum a possible window on what you already feel about a question, and nothing more. Do not use it to decide health or money matters.",
    src: [S2X + "06 PSYCHOMETRY TECHNIQUE.mp3", S2 + "06 Detecting and using psychic information.mp3"], rel: ["enhanced-awareness", "remote-viewing"] },

  { id: "rapport", cat: "esp", name: "Instant rapport", time: "4 min of programming, then one gesture", week: 11,
    tag: "Little finger to palm before you meet someone.",
    what: "A trigger for meetings. You program in advance that when you fold your little finger to touch your palm, the other person will sense that you are there to help and can be trusted.",
    steps: ["The night before, use the best-time-to-program technique.", "When you wake, sit up and enter your level.", "Fold the little finger of either hand, or both, to touch the palm.", "Think about the meeting and tell yourself: “Whenever I fold my little finger to touch my palm, as I am doing now, the person I am meeting will sense that I am there to help them, will know they can trust me, and we will have instant rapport.”", "In the meeting, make the gesture discreetly as you greet them."],
    tips: ["The workbook also uses the gesture to “awaken your intuitive radar” during the day.", "It works only if the premise is true. Go in to help."],
    honest: "What the gesture demonstrably changes is you: it reminds you of your intention, and people respond to someone who is calm and plainly on their side.",
    src: [S2X + "05 MENTAL REHEARSAL:BEST TIME TO PRGM:INSTANT RAPPORT TECHNIQUES.mp3", S2 + "05 Interacting with people.mp3"], rel: ["three-fingers", "rehearsal", "best-time"] },

  { id: "broadcasting", cat: "esp", name: "Broadcasting", time: "5 min, in the night", week: 11,
    tag: "Imagine sending a message and seeing it received.",
    what: "Silva’s name for communicating by thought. At the best time to program, you imagine broadcasting a message and picture the person or people receiving it and responding.",
    steps: ["Decide on one short, constructive message and whom it is for.", "Use the best-time-to-program technique at bedtime.", "The first time you wake, sit up and enter your level.", "Imagine broadcasting the message.", "Picture the person or people receiving it and responding in any ways you can imagine.", "Go back to sleep. Afterwards, say it to them in the ordinary way too."],
    tips: ["Keep it within the laws of programming: something you would be glad to receive yourself.", "The workbook asks you to write three messages, broadcast each, and record what happened."],
    honest: "There is no good evidence that thoughts travel this way. The exercise does make you compose the message carefully and imagine the other person’s reaction, which usually improves the real conversation.",
    src: [S2X + "07 BEST TIME TO PGM AND BROADCASTING TECHNIQUES.mp3", S2 + "07 Coincidences and advanced communications skills.mp3"], rel: ["best-time", "rapport"] },

  { id: "remote-viewing", cat: "esp", name: "Remote viewing, with a score sheet", time: "5–10 min per test", week: 11,
    tag: "Describe a hidden target, write it down, then check.",
    what: "The UltraMind material describes projecting your awareness to a distant place or situation to sense what is there. This app adds what the workbook also asks for: written records, so that you know your real hit rate.",
    steps: ["Set up a blind target. Easy versions: ask someone to put an object in a box; guess who will message you next; sense whether a person is at home before calling (an example from the course); or use a random photo you have not seen.", "Enter your level. State what you want to perceive.", "Imagine projecting yourself to the target. Notice first impressions through every sense: shapes, colours, textures, temperature, mood.", "Clear your mind for a moment, then let impressions come again.", "Come out and <b>write or sketch them before you check</b>.", "Check, and log hit, partial or miss.", "After a correct hunch, go to level and review how it felt, so that you can tell that feeling from wishful thinking next time."],
    tips: ["The course insists intuition is for constructive use, not ego or games. Keep the tests light and useful.", "Do at least 20 trials before drawing any conclusion, and be strict about what counts as a hit."],
    honest: "Decades of laboratory work have not produced a reliable remote-viewing effect. With honest scoring most people land near chance. The practice is still worth something: it trains you to notice faint impressions and to separate a calm hunch from hope or fear.",
    src: ["SILVA / UltraMind's Remote Viewing & Influencing.pdf", S2 + "08 Finding your purpose in life thru developing yur psychic ability.mp3", S1 + "14 Developing your God given ESP.mp3", "SILVA / Silva Ultramind Syst.mp3 (long recording, not transcribed)"], rel: ["enhanced-awareness", "psychometry"] },

  if (ev.target.id === 'md-tapf') { ev.preventDefault(); mdBuildTap(); document.getElementById('md-tout').innerHTML = V.mtapOut; return; }
  if (ev.target.id === 'md-jf') {
    ev.preventDefault();
    const x = document.getElementById('md-jx').value.trim(), n = document.getElementById('md-jn').value.trim(); if (!x && !n) return;

    persist('mind'); render(); toast('Entry saved');
  }
});


/* ---------- render + events ---------- */
const ICONS = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v4M12 3 9 6M12 3l3 3"/><path d="M8 21h8M12 21V11"/><path d="M5 13h14"/></svg>',
  progress:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/></svg>',
  breath:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h6"/></svg>',
  mind:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" opacity=".45"/><circle cx="12" cy="12" r="5" opacity=".75"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>',
  guide:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>',
  supps:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="7" rx="3.5" transform="rotate(-35 12 12.5)"/><path d="M9.5 8.2l4 6"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
};
function render(){
  const main = $('#main');
  const focusId = document.activeElement && document.activeElement.id;
  main.innerHTML = V.tab === 'today' ? renderToday() : V.tab === 'progress' ? renderProgress() : V.tab === 'guide' ? renderGuide() : V.tab === 'supps' ? renderSupps() : V.tab === 'breath' ? renderBreath() : V.tab === 'mind' ? renderMind() : renderSettings();
  $('#tabs').innerHTML = [['today','Today'],['progress','Progress'],['breath','Breath'],['mind','Mind'],['supps','Supps'],['guide','Guide'],['settings','Settings']].map(([k,l]) => `<button class="tab ${V.tab===k?'on':''}" data-act="tab" data-v="${k}" aria-current="${V.tab===k?'page':'false'}">${ICONS[k]}<span>${l}</span></button>`).join('');
  if (focusId) { const el = document.getElementById(focusId); if (el && el.tagName === 'INPUT' && el.type === 'text') { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch(e){} } }
}
function entry(code){
  const dk = DAYKEYS[V.dayIdx]; const lg = ensureLog(V.week, dk);
  return lg.entries[code] || (lg.entries[code] = { r:null, res:'', pain:false });
}
function saveSession(){ persist('log-' + logKey(V.week, DAYKEYS[V.dayIdx])); }
function pruneEntry(code){
  const lg = getLog(V.week, DAYKEYS[V.dayIdx]); const e = lg?.entries[code];
  if (e && !e.r && !e.res && !e.pain && !(e.dr && e.dr.length)) delete lg.entries[code];
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'tab') { V.tab = b.dataset.v; try { localStorage.setItem('ma2-tab', V.tab); } catch(e){} if (V.tab === 'today') { const p = todayPos(); V.week = p.week; V.dayIdx = p.dayIdx; } render(); window.scrollTo(0,0); }
  else if (a === 'wk') { V.week = Math.min(12, Math.max(1, V.week + (+b.dataset.d))); V.open = null; render(); }
  else if (a === 'day') { V.dayIdx = +b.dataset.i; V.open = null; render(); }
  else if (a === 'open') { V.open = V.open === b.dataset.c ? null : b.dataset.c; render(); }
  else if (a === 'ready') { const lg = ensureLog(V.week, DAYKEYS[V.dayIdx]); lg.readiness = lg.readiness === b.dataset.v ? null : b.dataset.v; saveSession(); render(); }
  else if (a === 'rate') { const e = entry(b.dataset.c); e.r = e.r === b.dataset.v ? null : b.dataset.v; e.t = Date.now(); pruneEntry(b.dataset.c); saveSession(); render(); if (e.r) toast('Saved'); }
  else if (a === 'delm') { S.metrics.entries = S.metrics.entries.filter(e => e.id !== b.dataset.id); persist('metrics'); render(); toast('Entry deleted'); }
  else if (a === 'reset') { V.confirmReset = true; render(); }
  else if (a === 'reset-no') { V.confirmReset = false; render(); }
  else if (a === 'reset-yes') { const keys = Object.keys(S.logs), months = Object.keys(S.supplog); S.logs = {}; S.metrics = { entries: [] }; S.supplog = {}; if (S.breath) { S.breath.done = {}; S.breath.bolt = []; S.breath.holds = []; persist('breath'); } if (S.mind) { S.mind.done = {}; S.mind.journal = []; persist('mind'); } keys.forEach(k => persist('log-' + k)); months.forEach(m => persist('supplog-' + m)); persist('metrics'); V.confirmReset = false; render(); toast('Logs erased'); }
  else if (a === 'backup') { doBackup(); }
  else if (a === 'rt') { const en = entry(b.dataset.c); const i = +b.dataset.i; en.dr = en.dr || []; const k = en.dr.indexOf(i); if (k >= 0) en.dr.splice(k, 1); else en.dr.push(i); en.t = Date.now(); pruneEntry(b.dataset.c); saveSession(); render(); }
  else if (a === 'imp-yes') { applyImport(V.pendingImport); V.pendingImport = null; render(); toast('Backup imported'); }
  else if (a === 'imp-no') { V.pendingImport = null; render(); }
  else if (a === 'lvl') { lvlUp(b.dataset.k, +b.dataset.d); render(); toast(lvlLabel(b.dataset.k)); }
  else if (a === 'sday') { const x = parseISO(V.sDate); x.setDate(x.getDate() + (+b.dataset.d)); if (iso(x) <= iso(new Date())) { V.sDate = iso(x); render(); } }
  else if (a === 'stake') { const ids = suppDay(V.sDate).slice(); const i = ids.indexOf(b.dataset.id); if (i >= 0) ids.splice(i,1); else ids.push(b.dataset.id); setSuppDay(V.sDate, ids); render(); }
  else if (a === 'sall') { setSuppDay(V.sDate, S.supps.items.map(i => i.id)); render(); toast('All ticked'); }
  else if (a === 'sedit') { V.sEdit = b.dataset.id; V.sDel = null; render(); const f = document.getElementById('sp-name'); if (f) f.scrollIntoView({block:'center'}); }
  else if (a === 'scancel') { V.sEdit = null; render(); }
  else if (a === 'sdel') { V.sDel = b.dataset.id; render(); }
  else if (a === 'sdel-no') { V.sDel = null; render(); }
  else if (a === 'sdel-yes') { S.supps.items = S.supps.items.filter(i => i.id !== b.dataset.id); V.sDel = null; persist('supps'); render(); toast('Removed'); }
});
let resT;
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.act === 'res') { const e = entry(t.dataset.c); e.res = t.value.slice(0, 80); e.t = Date.now(); clearTimeout(resT); resT = setTimeout(() => { pruneEntry(t.dataset.c); saveSession(); render(); }, 900); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.act === 'pain') { const e = entry(t.dataset.c); e.pain = t.checked; e.t = Date.now(); pruneEntry(t.dataset.c); saveSession(); render(); }
  if (t.id === 's-start' && t.value) { S.profile.startDate = iso(mondayOf(parseISO(t.value))); persist('profile'); const p = todayPos(); V.week = p.week; V.dayIdx = p.dayIdx; render(); toast('Start date saved'); }
  if (t.id === 'imp-file' && t.files && t.files[0]) {
    const f = t.files[0];
    f.text().then(txt => { let o = null; try { o = JSON.parse(txt); } catch(e) {} if (!validBackup(o)) { toast("That file isn't a Movement Athlete backup"); return; } V.pendingImport = o; render(); }).catch(() => toast('Could not read that file'));
  }
  if (t.id === 's-rm') { S.profile.rm = t.value ? Math.max(0, Math.min(150, +t.value)) : null; persist('profile'); render(); }
  if (t.id === 's-bw' && t.value) { S.profile.bw = Math.max(30, Math.min(200, +t.value)); persist('profile'); render(); }
});
document.addEventListener('submit', ev => {
  if (ev.target.id === 'suppf') {
    ev.preventDefault();
    const name = $('#sp-name').value.trim(); if (!name) return;
    const it = { name, dose: $('#sp-dose').value.trim(), timing: $('#sp-time').value };
    if (V.sEdit) { const x = S.supps.items.find(i => i.id === V.sEdit); if (x) Object.assign(x, it, { why: x.why, core: x.core }); V.sEdit = null; toast('Saved'); }
    else { S.supps.items.push(Object.assign({ id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,5) }, it)); toast('Added'); }
    persist('supps'); render(); return;
  }
  if (ev.target.id !== 'addm') return;
  ev.preventDefault();
  const k = $('#m-k').value, v = parseFloat($('#m-v').value), d = $('#m-d').value || iso(new Date());
  if (isNaN(v)) return;
  S.metrics.entries.push({ id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,5), k, v, d, t: Date.now() });
  if (k === 'bw') S.profile.bw = v, persist('profile');
  persist('metrics'); render(); toast('Benchmark saved');
});
async function doBackup(){
  const data = JSON.stringify(S, null, 2);
  const filename = 'movement-athlete-backup-' + iso(new Date()) + '.json';
  if (STANDALONE) {
    try {
      const file = new File([data], filename, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Movement Athlete backup' }); return; }
    } catch(e) { if (e && e.name === 'AbortError') return; }
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Backup saved to Downloads'); return;
  }
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (!dl) { toast('Downloads are not available here'); return; }
    await dl.save({ filename: 'movement-athlete-backup-' + iso(new Date()) + '.json', data });
  } catch(e) { if (e && e.code && e.code !== 'cancelled') toast('Backup not saved'); }
}
function validBackup(o){ return o && typeof o === 'object' && o.profile && typeof o.logs === 'object' && o.metrics && Array.isArray(o.metrics.entries); }
function applyImport(o){
  const oldLogs = Object.keys(S.logs), oldMonths = Object.keys(S.supplog);
  S.profile = Object.assign({ startDate: S.profile.startDate, bw: 90 }, o.profile);
  S.logs = o.logs || {}; S.metrics = { entries: (o.metrics.entries || []) };
  S.supps = o.supps && Array.isArray(o.supps.items) ? o.supps : { items: [] };
  S.supplog = o.supplog || {};
  S.breath = o.breath ? Object.assign(BR_DEF(), o.breath) : BR_DEF(); persist('breath');
  S.mind = o.mind ? Object.assign(MD_DEF(), o.mind) : MD_DEF(); persist('mind');
  new Set([...oldLogs, ...Object.keys(S.logs)]).forEach(k => persist('log-' + k));
  new Set([...oldMonths, ...Object.keys(S.supplog)]).forEach(m => persist('supplog-' + m));
  persist('profile'); persist('metrics'); persist('supps');
  const p = todayPos(); V.week = p.week; V.dayIdx = p.dayIdx;
}
seedCore();
migrateCodes();
render();
initDb();
