<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15181d"><meta name="description" content="12-week handstand, movement and athleticism program with logging, skill ladder, breathwork and supplement tracker."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style><title>Movement Athlete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column, one session at a time, bottom tab bar; chalk-on-graphite gym board */
:root{
  --bg:#f2f0eb; --surface:#ffffff; --surface2:#e9e6df; --line:#d9d4ca; --fg:#1b1d22; --mut:#6c6a64;
  --accent:#8a6a0c; --accent-ink:#ffffff; --accentSoft:#f1e6c4;
  --good:#2f7d4f; --warn:#b06a10; --bad:#b23a32;
  --pt:#c9501a; --sb:#1f6f6a; --rg:#6a4c93; --tm:#3d6fa8; --atg:#857318;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181d; --surface:#1d2128; --surface2:#262b33; --line:#323842; --fg:#eceae5; --mut:#9a9c9f;
  --accent:#e7c457; --accent-ink:#1b1d22; --accentSoft:#3a3424;
  --good:#5fbf86; --warn:#e6a04a; --bad:#ef7d72;
  --pt:#e57a45; --sb:#4fb3aa; --rg:#a389cf; --tm:#76a3d8; --atg:#c9b54f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181d; --surface:#1d2128; --surface2:#262b33; --line:#323842; --fg:#eceae5; --mut:#9a9c9f;
  --accent:#e7c457; --accent-ink:#1b1d22; --accentSoft:#3a3424;
  --good:#5fbf86; --warn:#e6a04a; --bad:#ef7d72;
  --pt:#e57a45; --sb:#4fb3aa; --rg:#a389cf; --tm:#76a3d8; --atg:#c9b54f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.wk-title{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.wk-title small{display:block;font-size:15px;font-family:var(--f-body);font-weight:600;letter-spacing:.12em;color:var(--accent);margin-bottom:4px}
.wk-nav{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:18px}
.icon-btn:focus-visible,.chip:focus-visible,.day:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:14px 0 12px}
.weeks i{height:6px;border-radius:3px;background:var(--surface2)}
.weeks i.done{background:var(--mut)} .weeks i.cur{background:var(--accent)} .weeks i.dl{opacity:.55}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0 6px;text-align:center;cursor:pointer;position:relative}
.day b{display:block;font-size:12px;letter-spacing:.06em}
.day span{font-size:10px;color:var(--mut)}
.day.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)} .day.sel span{color:inherit;opacity:.75}
.day.today:not(.sel){border-color:var(--accent)}
.day .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--good)}
.day .dot.part{background:var(--warn)}

/* banners */
.banner{margin:12px 0 0;padding:11px 13px;border-radius:12px;background:var(--accentSoft);font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner b{display:block}
.banner.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.banner.info{background:var(--surface2)}

/* session */
.sess-head{margin:20px 0 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-end}
.sess-head h2{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase}
.sess-head .sub{font-size:12.5px;color:var(--mut);margin-top:4px}
.ready{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.ready .lbl{font-size:12.5px;color:var(--mut);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.easy.on{background:var(--good);border-color:var(--good);color:#fff}
.chip.right.on{background:var(--tm);border-color:var(--tm);color:#fff}
.chip.hard.on{background:var(--warn);border-color:var(--warn);color:#fff}
.chip.miss.on{background:var(--bad);border-color:var(--bad);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex.logged{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.ex-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:12px 12px 12px 10px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.code{font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--mut);padding-top:2px}
.ex.logged .code{color:var(--good)}
.ex-name{font-weight:650;font-size:15px;line-height:1.3;min-width:0}
.rx{font-family:var(--f-num);font-weight:700;font-size:14px;text-align:right;white-space:normal;max-width:9.5em;line-height:1.3;padding-top:1px}
.rx .was{display:block;font-size:11px;font-weight:500;color:var(--mut);text-decoration:line-through}
.tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;align-items:center}
.src{font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:4px;color:#fff}
.s-PT{background:var(--pt)}.s-SB{background:var(--sb)}.s-RG{background:var(--rg)}.s-TM{background:var(--tm)}.s-ATG{background:var(--atg)}
.adj{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px}
.adj.up{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.adj.down{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.adj.pain{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.rated{font-size:11px;font-weight:700;color:var(--mut)}
.ex-body{padding:0 12px 14px 54px;display:flex;flex-direction:column;gap:10px}
.ex-note{font-size:13.5px;color:var(--mut)}
.why{font-size:12.5px;background:var(--surface2);border-radius:8px;padding:8px 10px}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px}
.pain{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.pain input{width:18px;height:18px;accent-color:var(--bad)}
.prep-list{margin:0;padding:0 0 0 0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.prep-list li{display:flex;justify-content:space-between;gap:10px}
.prep-list li span:last-child{font-family:var(--f-num);font-size:12.5px;white-space:nowrap}
.rest-card{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;margin-top:18px}
.rest-card h2{font-family:var(--f-display);font-size:34px;text-transform:uppercase}
.complete{margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--fg)}

/* progress */
.metric{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.metric h3{font-size:14.5px;font-weight:650}
.metric .val{font-family:var(--f-num);font-size:22px;font-weight:700;text-align:right;line-height:1}
.metric .val small{font-size:12px;color:var(--mut);font-weight:500}
.metric .meta{font-size:12px;color:var(--mut)}
.metric svg{grid-column:1/-1;width:100%;height:56px;display:block;margin-top:4px}
.bar{height:6px;border-radius:3px;background:var(--surface2);grid-column:1/-1;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.addm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;margin:12px 0}
.addm .row{display:flex;gap:8px;flex-wrap:wrap}
select,input[type=number],input[type=date]{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px;min-width:0}
.addm select{flex:2 1 180px}.addm input{flex:1 1 90px}
.section-title{font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;margin:16px 0 8px;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.hist{font-size:12.5px;margin-top:8px}
.hist summary{cursor:pointer;color:var(--mut)}
.hist ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:4px}
.hist li{display:flex;justify-content:space-between;gap:8px}
.hist button{background:none;border:0;color:var(--bad);cursor:pointer;font-size:12px}

/* guide */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.card h3{font-size:15px;margin-bottom:6px}
.card ul{margin:0;padding-left:18px;font-size:14px}.card li{margin-bottom:5px}
.gl{border-top:1px solid var(--line);padding:9px 0;font-size:13.5px}
.gl:first-of-type{border-top:0}
.gl b{display:block}
.gl .alt{color:var(--sb);font-size:12.5px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row label{font-weight:600;font-size:14px}
.set-row .hint{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.confirm{display:flex;gap:8px;margin-top:8px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabbar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.tab{border:0;background:none;padding:6px 0;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);min-width:0}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--fg)} .tab.on svg{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;z-index:6;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.sync{font-size:11px;color:var(--mut);display:flex;gap:6px;align-items:center}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mut);display:inline-block}
.sync.ok i{background:var(--good)} .sync.local i{background:var(--warn)}
.supp-row{grid-template-columns:34px 1fr 0}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.check.on{background:var(--good);border-color:var(--good)}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:2px;margin-top:8px;max-width:220px}
.strip i{height:6px;border-radius:2px}
.lvl{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--accentSoft);color:var(--fg)}
.lvlbox{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.btn[disabled]{opacity:.45;cursor:default}
.s-HP{background:#a8325e}.s-HW{background:#2f7d6d}.s-PG{background:#5a5f6b}
.rt-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rt-item{width:100%;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}
.rt-item.on{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.rt-txt{display:flex;flex-direction:column;gap:2px;font-size:13.5px;min-width:0}
.rt-dose{font-family:var(--f-num);font-weight:700;font-size:13px}
.s-DW{background:#b5651d}
.pair{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid var(--accent);color:var(--fg)}
.howrun{margin:0 0 10px;background:var(--surface2);border-radius:12px;padding:9px 12px;font-size:13px}
.howrun summary{cursor:pointer;font-weight:700}
.howrun div{margin-top:6px;color:var(--fg)}
/* breathwork */
:root{--b-in:var(--sb);--b-out:var(--tm);--b-hold:var(--accent);--b-rest:var(--mut)}
.brcard{margin-top:12px}
.br-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.br-head .num{font-size:12.5px;white-space:nowrap}
.br-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.br-stats.three{grid-template-columns:repeat(3,1fr)}
.br-stats .metric{padding:10px 12px}
.br-stats.three .val{font-size:19px}
.br-slot{margin:10px 0 2px}
.br-item{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.br-slot + .br-item, .br-list > .br-item:first-child{border-top:0}
.br-item .check{width:26px;height:26px;cursor:pointer;background:none}
.br-item.done .br-txt b{text-decoration:line-through;color:var(--mut)}
.br-txt{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:14px}
.br-txt .mut{font-size:12px}
.br-go{padding:7px 12px;font-size:13px}
.br-note{font-size:12.5px;border-radius:8px;padding:8px 10px;margin-top:8px;background:var(--accentSoft)}
.br-note.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.br-note.info{background:var(--surface2);margin:0 0 4px}
.br-more{font-size:13px;margin:0 0 6px 40px}
.br-txt .br-more{margin:4px 0 0}
.br-day{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.br-day > summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-weight:650;font-size:14px;list-style:none}
.br-day > summary::-webkit-details-marker{display:none}
.br-day > summary span:first-child::before{content:'▸ ';color:var(--mut)}
.br-day[open] > summary span:first-child::before{content:'▾ '}
.br-day > summary .num{font-size:12.5px}
.br-more summary{cursor:pointer;color:var(--sb);font-weight:600;font-size:12.5px}
.br-more ol,.br-steps{margin:4px 0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px;font-size:13px}
.br-libbody{display:flex;flex-direction:column;gap:6px;padding:4px 0 10px;font-size:13.5px}
.br-libbody .eyebrow{margin-top:4px}
.br-lib,.br-week{border-top:1px solid var(--line);padding:9px 0}
.br-lib:first-child,.br-week:first-child{border-top:0}
.br-lib summary,.br-week summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;list-style:none;font-size:14px}
.br-lib summary::-webkit-details-marker,.br-week summary::-webkit-details-marker{display:none}
.br-lib summary .num,.br-week summary .num{font-size:12px}
.br-h{font-size:22px;margin:16px 0 6px}
.br-h small{font-size:12px;font-family:var(--f-num);text-transform:none;letter-spacing:0}
.br-phase{border-left:3px solid var(--b-in);padding:2px 0 2px 12px;margin:6px 0 10px}
.br-phase.p2{border-color:var(--b-hold)} .br-phase.p3{border-color:var(--b-out)}
.br-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface2);border-radius:12px;padding:4px;margin:12px 0 6px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:13px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.br-bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:80px}
.br-bars div{background:var(--surface2);border-radius:3px 3px 0 0;height:100%;position:relative;overflow:hidden}
.br-bars div.now{outline:1.5px solid var(--fg);outline-offset:1px}
.br-bars i{position:absolute;left:0;right:0;bottom:0;background:var(--b-in)}
.br-barlab{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;text-align:center;font-size:11px;color:var(--mut);font-family:var(--f-num);margin-top:4px}
.brsum{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
#bplayer{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));text-align:center}
#bplayer[hidden]{display:none}
.bp-top{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.bp-top h2{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
#bp-prog{width:100%;max-width:520px;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
#bp-prog i{display:block;height:100%;background:var(--fg);width:0}
#bp-stage{flex:1;display:grid;place-items:center;width:100%;min-height:0}
#bp-ring{width:min(62vw,46vh,340px);aspect-ratio:1;border-radius:50%;border:1px dashed var(--line);display:grid;place-items:center;position:relative}
#bp-orb{position:absolute;inset:0;border-radius:50%;background:var(--pc,var(--b-in));opacity:.22;transform:scale(.3)}
#bp-orbline{position:absolute;inset:0;border-radius:50%;border:2px solid var(--pc,var(--b-in));transform:scale(.3)}
#bp-count{position:relative;font:700 52px var(--f-num);font-variant-numeric:tabular-nums}
#bp-phase{font-family:var(--f-display);font-weight:800;font-size:34px;text-transform:uppercase;color:var(--pc,var(--b-in))}
#bp-cue{max-width:40ch;min-height:3em;margin:4px auto 10px;font-size:14px}
.bp-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bp-bottom{display:flex;flex-direction:column;align-items:center}
</style>
</head><body><main class="wrap" id="main"></main>

 10 + 15s per leg","","PT"],["Wall walk-down + stand-up from bridge","3 sets × 3","One hand on the wall until it's easy","PT/SB"],["German hang with slow skin-the-cat back to hang","3 sets × 20s + 3","Control the way back","PT"],["Chest-to-wall shoulder stretch","3 sets × 45s","","PT"],["Passive hang + deep squat to finish","1 set × 90s + 90s","","RG"]]],"dw_flow":["Sunday flow (optional) · Dylan Werner dynamic mobility","20–25 min, easy pace · move in and out of end range, about 1s per rep",[["Hops, high knees, butt kicks","1 set × 20 each","Gentle, just to warm up","DW"],["Arm bounces: overhead, side, down","1 set × 10 each","Move the chest and spine with the arms","DW"],["Shoulder circles, then shoulder rolls","1 set × 20 forward + 20 back per arm","Shoulder blade follows the arm","DW"],["Neck: up/down, turns, ear to shoulder","1 set × 10 each","Semicircles only if full circles bother you","DW"],["Standing twists + forward-fold bounces (centre, left, right)","1 set × 10 each","Quads on, legs as straight as you can","DW"],["Down dog shoulder bounces → up dog rocks","1 set × 10 + 10","Shoulders toward the ears in down dog","DW"],["Down dog leg swings","1 set × 10 per leg","","DW"],["Low lunge hip bounces → half-split pulses","1 set × 10 + 10 per side","Flex the front foot on the half split","DW"],["Lizard (knee out) bounces → half-split pulses","1 set × 10 + 10 per side","","DW"],["Pigeon forward lifts + hold","1 set × 10 + 5 breaths per side","Arms down, out or overhead for more intensity","DW"],["Butterfly bounces → walk forward and hold","1 set × 10 + 5 breaths","","DW"],["Wide straddle forward pulses + hold","1 set × 10 + 5 breaths","Lead with the belly","DW"],["Supine twist","1 set × 1 min per side","Always finish a backbend or mobility day with a twist","DW"]]]},"dw":["Daily 10s: a little every day beats one long session a week.","Make every entry identical. If it feels easy, you're doing it right.","Use the wall as a tool, not a crutch. Move away from it as soon as you can.","Brake with cambered fingers: grip the floor and slide the fingertips back while the palm stays flat.","Mobility is active: move in and out of the end range, 10 reps, then hold.","Fascial holds: 5–8 slow belly breaths, sensation over depth.","Follow backbends with a twist to reset the spine."],"howto":[["Go top to bottom","Do the blocks in letter order: A, then B, then C… The warm-up (A) is always first and handstand work always comes before strength."],["A single letter (B, D…)","Do all the sets of that exercise, resting as written, then move on to the next letter."],["Same letter with numbers (C1, C2…)","These go together. Do 1 set of C1 → rest → 1 set of C2 (→ C3…) → rest → back to C1, until every set is done. If one exercise has more sets than its partner, do its extra sets at the end. Then go to D."],["“During the rest” stretches","Some partners are stretches (e.g. a middle-split hold paired with side flexion). Do them in the rest after each set of their partner, so they add no extra time."],["Reading a prescription","“3 sets × 10” = 3 sets of 10 reps. “4 sets × 30s” = four 30-second holds. /side, /leg, /arm = each side. “@ 80kg” = load. “5 sets · 12-10-8-6-4s” = one hold per number. “up to 5 sets · collect 120s” = reach 120s in total in 5 attempts or fewer. “3 sets × the circuit” = 3 passes through every drill listed in the notes. “1 set · 15 min” = one continuous block."],["Default rests","When no rest is written: handstand sets 60–90s (one-arm work and long holds 2 min), heavy strength 2–3 min, other strength 90s, core, grip and accessories 45–60s, mobility as needed."]],"codemap":{"P1":{"D1":{"A":"A","B1":"B","B2":"C","C1":"D1","C2":"D2","D":"E","E":"F","F1":"G1","F2":"G2","G":"H","H":"I","I":"J2","J":"K1"},"D2":{"A":"A","B":"B","C":"C","D1":"D1","D2":"D2","E":"E","F1":"F1","F2":"F2","G":"G1","H":"H"},"D3":{"A":"A","B1":"B","C2":"C1","B2":"C2","C3":"D","C1":"E1","C4":"E2","D":"F","E1":"G1","E2":"G2","F":"H1","G":"I"},"D4":{"A":"A","B":"B1","C":"C","D":"D","E1":"E1","E2":"E2","F1":"F1","F2":"F2","G":"G1","H":"H"},"D5":{"A":"A","B":"B","C1":"C1","C2":"C2","C3":"D","D":"E1","E":"F1","F":"G","G1":"H1","G2":"H3","G3":"H4","H":"I1","I":"J"},"D6":{"A":"A","B":"B","C1":"C1","C2":"C2","C3":"C3","C4":"C4","C5":"C5","C6":"D","D":"E","E":"F","E2":"G","F":"I"}},"P2":{"D1":{"A":"A","B":"B","C1":"C1","C2":"C2","D":"D","E":"E","F1":"F1","F2":"F2","G":"G1","H":"H","I":"K","J":"L1"},"D2":{"A":"A","B":"B","C":"D","D1":"E1","D2":"E2","E":"F","F":"G1","G":"H"},"D3":{"A":"A","B":"B","C2":"C1","C3":"C2","C4":"D2","C1":"E","D1":"F","D2":"G","E":"H","F1":"I1","F2":"J","G":"K1"},"D4":{"A":"A","B":"B","C":"C","D":"D","E1":"E1","E2":"E2","F1":"F1","F2":"F2","G":"G1","H":"H"},"D5":{"A":"A","B":"B","C1":"C1","C2":"D1","C3":"E","D":"F","E":"G","F":"H","G":"I1","H":"J1","I":"K1"},"D6":{"A":"A","B":"B","C1":"C1","C2":"C2","C3":"C3","C4":"C4","D":"D","D2":"E","D3":"F","D4":"G","E":"H","F":"I"}},"P3":{"D1":{"A":"A","B":"B","C1":"C","C2":"D","D":"E","E1":"F1","E2":"F2","F":"G","G":"H","H":"I","I":"J"},"D2":{"A":"A","B":"B","C1":"C1","C2":"C2","D1":"D1","D2":"D2","E":"E","F":"F1","G":"G"},"D3":{"A":"A","B":"B","C1":"C1","C2":"C2","C3":"D2","C4":"E","D1":"F","D2":"G","E":"H","E2":"I","F":"J"},"D4":{"A":"A","B":"B","C":"C","D":"D","E1":"E1","E2":"E2","F":"F1","G":"G1","H":"H"},"D5":{"A":"A","B":"B","C":"D1","D":"E","E":"F1","F":"G","G":"H1","H":"I1","I":"J"},"D6":{"A":"A","B":"B","C":"C","D":"D","D2":"E","D3":"F","D4":"H1","E":"I"}}}}</script>
<script>
const STANDALONE = true;
const P = JSON.parse(document.getElementById('program').textContent);
const DAYKEYS = ['D1','D2','D3','D4','D5','D6','D7'];
const DAYSHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const SRC = {PT:'Paul Twyman',SB:'Sondre Berg',RG:'Roye Gold',TM:'Tom Merrick',ATG:'ATG',HP:'Handstand Phases',HW:'Wall handstand sessions',PG:'Pull-up & grip program',DW:'Dylan Werner'};
const EL = {}; P.elements.forEach(e => EL[e[0]] = { key:e[0], name:e[1], phase:e[2], purpose:e[3], params:e[4], vers:e[5], base:e[6], adv:e[7], start:e[8], type:e[9] });
const RATINGS = [['easy','Easy'],['right','Right'],['hard','Hard'],['miss','Missed']];
const METRICS = [
 {k:'hs',n:'Freestanding handstand',u:'s',start:30,target:60},
 {k:'oahsA',n:'One-arm handstand, better side',u:'s',start:2,target:10},
 {k:'oahsB',n:'One-arm handstand, other side',u:'s',start:0,target:5},
 {k:'fl',n:'Front lever',u:'s',start:5,target:10},
 {k:'oapS',n:'One-arm pull-up, strict',u:'reps',start:0,target:1},
 {k:'oapB',n:'One-arm pull-up, band-assisted',u:'reps',start:2,target:5},
 {k:'hangL',n:'One-arm hang, left',u:'s',start:30,target:45},
 {k:'hangR',n:'One-arm hang, right',u:'s',start:30,target:45},
 {k:'hang2',n:'Two-arm hang',u:'s',start:90,target:120},
 {k:'hspu',n:'Wall HSPU, clean reps',u:'reps',start:4,target:8},
 {k:'press',n:'Straddle press to handstand',u:'reps',start:0,target:3},
 {k:'fshspu',n:'Freestanding HSPU',u:'reps',start:0,target:3},
 {k:'wpu',n:'Weighted pull-up, 3 reps',u:'kg',start:40,target:47.5},
 {k:'lsit',n:'L-sit',u:'s',start:10,target:30},
 {k:'planche',n:'Advanced-tuck planche',u:'s',start:0,target:10},
 {k:'pancake',n:'Pancake, chest to floor',u:'cm',lower:true},
 {k:'fsplit',n:'Front split, hip to floor',u:'cm',lower:true},
 {k:'msplit',n:'Middle split, hip to floor',u:'cm',lower:true},
 {k:'bridge',n:'Bridge, hands to heels',u:'cm',lower:true},
 {k:'bridgeHold',n:'Straight-arm bridge hold',u:'s',start:0,target:45},
 {k:'bw',n:'Bodyweight',u:'kg',start:90,target:90,flat:true},
];
const TEST_BY_DAY = {D1:0,D2:1,D3:2,D4:3,D5:4,D6:5};

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function todayPos(){
  const start = parseISO(S.profile.startDate), now = new Date();
  const t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((t - start)/86400000);
  if (diff < 0) return {week:1, dayIdx:0, before:true, days:-diff};
  const week = Math.floor(diff/7)+1;
  if (week > 12) return {week:12, dayIdx:6, after:true};
  return {week, dayIdx: diff%7};
}
function dateOf(week, dayIdx){ const d = parseISO(S.profile.startDate); d.setDate(d.getDate() + (week-1)*7 + dayIdx); return d; }

/* ---------- state ---------- */
const LS_KEY = 'ma2-state-v1';
let S = { profile:{ startDate: iso(mondayOf(new Date())), bw:90 }, logs:{}, metrics:{ entries:[] }, supps:{ items:[] }, supplog:{} };
function loadLocal(){ try { const r = localStorage.getItem(LS_KEY); if (r) { const o = JSON.parse(r); S.profile = Object.assign(S.profile, o.profile||{}); S.logs = o.logs||{}; S.metrics = o.metrics||{entries:[]}; S.supps = o.supps||{items:[]}; S.supplog = o.supplog||{}; S.breath = o.breath||null; return true; } } catch(e){} return false; }
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }
const hadLocal = loadLocal();

let DB = null, UID = null, syncMode = 'local';
const queue = {};
function persist(docId){
  saveLocal();
  if (!DB || !UID) return;
  clearTimeout(queue[docId]?.t);
  queue[docId] = queue[docId] || {};
  queue[docId].t = setTimeout(() => flush(docId), 700);
}
async function flush(docId){
  const q = queue[docId];
  if (q.busy) { q.again = true; return; }
  q.busy = true;
  try {
    const body = docId === 'profile' ? S.profile : docId === 'metrics' ? S.metrics : docId === 'supps' ? S.supps : docId === 'breath' ? S.breath : docId.startsWith('supplog-') ? (S.supplog[docId.slice(8)] ? { days: S.supplog[docId.slice(8)] } : null) : S.logs[docId.slice(4)];
    const ref = DB.collection('data/users/' + UID).doc(docId);
    if (body) await ref.set(JSON.parse(JSON.stringify(body))); else await ref.delete();
    setSync('ok');
  } catch(e) {
    if (e && e.code === 'unavailable') { setTimeout(() => flush(docId), 1500 + Math.random()*1000); }
    else if (e && e.code === 'quota_exceeded') toast('Storage is full. Delete old benchmark entries.');
    else { setSync('local'); }
  } finally {
    q.busy = false;
    if (q.again) { q.again = false; flush(docId); }
  }
}
async function initDb(){
  if (STANDALONE || !window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    DB = db; UID = uid;
    let first = true;
    DB.collection('data/users/' + UID).onSnapshot(snap => {
      if (snap.empty && first && hadLocal) {
        // first time on the synced store: upload what this device has
        first = false; setSync('ok');
        persist('profile'); persist('metrics'); persist('supps'); if (S.breath) persist('breath'); Object.keys(S.supplog).forEach(m => persist('supplog-' + m)); Object.keys(S.logs).forEach(k => persist('log-' + k));
        return;
      }
      first = false;
      const logs = {};
      let profile = null, metrics = null, supps = null, breath = null; const supplog = {};
      snap.docs.forEach(d => {
        if (d.id === 'profile') profile = d.data();
        else if (d.id === 'metrics') metrics = d.data();
        else if (d.id === 'supps') supps = d.data();
        else if (d.id === 'breath') breath = d.data();
        else if (d.id.startsWith('supplog-')) supplog[d.id.slice(8)] = (d.data().days || {});
        else if (d.id.startsWith('log-')) logs[d.id.slice(4)] = d.data();
      });
      if (!snap.metadata.hasPendingWrites) {
        if (profile) S.profile = Object.assign({}, S.profile, profile);
        if (metrics) S.metrics = { entries: (metrics.entries || []).slice() };
        S.logs = JSON.parse(JSON.stringify(logs));
        if (supps) S.supps = { items: JSON.parse(JSON.stringify(supps.items || [])) };
        S.supplog = JSON.parse(JSON.stringify(supplog));
        if (breath) S.breath = Object.assign(BR_DEF(), JSON.parse(JSON.stringify(breath)));
        seedCore();
        migrateCodes();
        saveLocal();
        render();
      }
      setSync('ok');
    }, err => { setSync('local'); });
  } catch(e) {}
}
function setSync(m){ syncMode = m; const el = document.getElementById('sync'); if (el) { el.className = 'sync ' + m; el.lastChild.textContent = m === 'ok' ? 'Synced to your account' : 'Saved on this device'; } }

/* ---------- code migration (v5 regrouping) ---------- */
function migrateCodes(){
  if (!P.codemap) return false;
  let changed = [];
  Object.keys(S.logs).forEach(k => {
    const lg = S.logs[k];
    if (!lg || lg.v === 5) return;
    const m = k.match(/^w(\d+)-(D\d)$/); if (!m) { lg.v = 5; return; }
    const week = +m[1], ph = 'P' + Math.min(3, Math.floor((week - 1) / 4) + 1), map = (P.codemap[ph] || {})[m[2]] || {};
    const ne = {};
    Object.entries(lg.entries || {}).forEach(([c, e]) => { const nc = map[c]; if (nc && !ne[nc]) ne[nc] = e; });
    lg.entries = ne; lg.v = 5; changed.push(k);
  });
  changed.forEach(k => persist('log-' + k));
  return changed.length > 0;
}

/* ---------- element levels ---------- */
function lvl(key){ const e = EL[key]; const L = (S.profile.levels || {}); return L[key] != null ? L[key] : e.start; }
function setLvl(key, v){ S.profile.levels = Object.assign({}, S.profile.levels || {}, { [key]: v }); persist('profile'); }
function lvlLabel(key){ const e = EL[key]; if (!e) return ''; if (e.type === 'accum') return 'Target: collect ' + lvl(key) + 's' + (key === 'oa_hold' ? ' per arm' : ''); if (lvl(key) >= e.vers.length) return 'Mastered'; const v = e.vers[lvl(key)]; return v ? v[0] : ''; }
function lvlReq(key){ const e = EL[key]; if (e.type === 'accum') return key === 'oa_hold' ? 'Reach the total per arm in 2 reps (one clean hold each), then +5s' : 'Reach the total in 5 sets or fewer, then +5s'; if (lvl(key) >= e.vers.length) return 'Done. Keep it as maintenance or push toward ' + e.adv; const v = e.vers[lvl(key)]; return v ? v[2] : ''; }
function lvlHow(key){ const e = EL[key]; if (e.type === 'accum') return e.params; const v = e.vers[Math.min(lvl(key), e.vers.length-1)]; return v ? v[1] : ''; }
function lvlUp(key, d){
  const e = EL[key];
  if (e.type === 'accum') { setLvl(key, Math.max(5, lvl(key) + 5*d)); return; }
  setLvl(key, Math.max(0, Math.min(e.vers.length, lvl(key) + d)));
}
function lvlButtons(key){
  const e = EL[key];
  if (e.type === 'accum') return `<div class="confirm" style="margin:0"><button class="btn" data-act="lvl" data-k="${key}" data-d="1">Made it: +5s</button><button class="btn ghost" data-act="lvl" data-k="${key}" data-d="-1">−5s</button></div>`;
  const i = lvl(key), n = e.vers.length;
  if (i >= n) return `<div class="confirm" style="margin:0"><span class="lvl" style="align-self:center">✓ Mastered</span><button class="btn ghost" data-act="lvl" data-k="${key}" data-d="-1">Undo</button></div>`;
  const up = i === n-1 ? 'Passed: mark mastered' : 'Passed: level up';
  return `<div class="confirm" style="margin:0"><button class="btn" data-act="lvl" data-k="${key}" data-d="1">${up}</button>${i>0?`<button class="btn ghost" data-act="lvl" data-k="${key}" data-d="-1">Level down</button>`:''}</div>`;
}
/* ---------- pull-up 1RM ---------- */
function oneRM(){
  if (S.profile.rm) return { v: +S.profile.rm, src: 'set in Settings' };
  const ents = S.metrics.entries.filter(e => e.k === 'wpu').sort((a,b) => a.d < b.d ? -1 : 1);
  const w = ents.length ? ents[ents.length-1].v : 40, bw = +S.profile.bw || 90;
  return { v: Math.round(((bw + w) * (1 + 3/30) - bw) * 2) / 2, src: ents.length ? 'estimated from your latest 3-rep benchmark' : 'estimated from +40kg × 3' };
}
function withKg(text){
  const rm = oneRM().v;
  return String(text).replace(/ The app shows the kg\..*$/, '').replace(' The app shows the kg', '').replace(/(\d+)%/g, (m, p) => `${p}% (≈${Math.round(rm * p / 100 * 2) / 2}kg)`);
}

/* ---------- program helpers ---------- */
const clean = s => s.replace(/\s*\(page \d+\)/, '').replace(/\s*—\s*see Prep/, '');
function phaseOf(week){ return P.phases[Math.min(2, Math.floor((week-1)/4))]; }
function sessionOf(week, dayKey){ const ph = phaseOf(week); return ph.days[dayKey] || null; }
const isDeload = w => w === 4 || w === 8;
function logKey(week, dayKey){ return 'w' + pad(week) + '-' + dayKey; }
function getLog(week, dayKey){ return S.logs[logKey(week, dayKey)]; }
function ensureLog(week, dayKey){
  const k = logKey(week, dayKey);
  if (!S.logs[k]) S.logs[k] = { week, day: dayKey, readiness: null, entries: {}, v: 5 };
  return S.logs[k];
}

/* ---------- adjustment engine ---------- */
function adjustRx(rx, L, halve){
  if(!rx) return rx;
  let s = rx, load = '';
  const hasLoad = /kg|@\s?\+?\d/.test(rx);
  const at = s.indexOf('@');
  if (at >= 0) { load = s.slice(at); s = s.slice(0, at); }
  s = s.replace(/(\d+)\s?(?:sets?\s)?×\s?(\d+(?:\.\d+)?)(\s?(?:s|min)\b)?|(\d+(?:-\d+)*)s\b|([+]?)(\d+(?:\.\d+)?)\s?kg/g,
    (m, sets, val, unit, secs, plus, kg) => {
      if (sets !== undefined) {
        let ns = +sets, nv = +val;
        if (L) {
          if (!unit) { if (hasLoad) {} else if (nv === 1) ns = Math.max(1, ns + L); else nv = Math.max(1, nv + L); }
          else if (/s/.test(unit)) nv = Math.max(1, Math.round(nv * (1 + 0.1 * L)));
        }
        if (halve) ns = Math.max(1, Math.ceil(ns / 2));
        return /sets?\s/.test(m) ? ns + (ns === 1 ? ' set' : ' sets') + ' × ' + nv + (unit || '') : ns + ' × ' + nv + (unit || '');
      }
      if (secs !== undefined) {
        if (!L) return m;
        return secs.split('-').map(x => Math.max(1, Math.round(+x * (1 + 0.1 * L)))).join('-') + 's';
      }
      if (kg !== undefined) { if (!L) return m; return plus + fmtKg(Math.max(0, +kg + 2.5 * L)) + 'kg'; }
      return m;

  const pos = todayPos();
  for (let w = 1; w <= Math.min(12, pos.week); w++) for (let di = 0; di < 6; di++) { if (w === pos.week && di > pos.dayIdx) break; planned++; if (getLog(w, DAYKEYS[di]) && Object.keys(getLog(w, DAYKEYS[di]).entries).length) logged++; }
  if (!pos.before) h += `<div class="card" style="margin-top:10px"><h3>Sessions logged</h3><div class="num" style="font-size:22px;font-weight:700">${logged} / ${planned}</div><div class="mut" style="font-size:12.5px">Counted up to today</div></div>`;
  return h;
}

  if (S.profile.coreSeeded) return false;

test:{n:'Breath-hold test',tag:'Capacity',
  how:'Two holds after a normal exhale, always measured the same way. First: tap at the first clear urge to breathe (your comfortable pause, used for training). Second: tap at a strong but manageable urge (your BOLT score). Do it rested, before any fast breathing.',
  b:()=>[['Settle',[R(60,'Sit quietly. Breathe normally through the nose')]],['Comfortable pause',[I(3,'Normal breath in',.7),O(3,'Normal breath out',.4),X('Hold empty. Tap at the FIRST clear urge to breathe','pause'),R(90,'Recover. Normal breathing')]],['BOLT score',[I(3,'Normal breath in',.7),O(3,'Normal breath out',.4),X('Hold empty. Tap at a strong but manageable urge','bolt'),R(20,'Breathe normally. You should not need to gasp')]]]},
/* themed sequences */
sEquanimity:{n:'Sequence: Equanimity',tag:'Balance',
  how:'Equal-breath ladder up, alternate-nostril box breathing, interrupted breathing (viloma 3), ladder back down. If viloma leaves you short of breath, count faster: this one should feel steady, never strained.',
  b:()=>[['Warm-up · ladder',seq(11,i=>[I(5+i,'Inhale '+(5+i)),O(5+i,'Exhale '+(5+i))])],['Heat · alternate-nostril box',rep(10,nadiBox(5))],['Vitalizing · viloma 3',rep(8,viloma(true))],['Cool-down · ladder',seq(11,i=>[I(15-i,'Inhale '+(15-i)),O(15-i,'Exhale '+(15-i))]).concat([R(45,'Natural breath. Notice the shift')])]]},
sRelax:{n:'Sequence: Deep relaxation',tag:'Calm',
  how:'Three-part breathing, a lengthening exhale, then gentle holds: 30 seconds full and 15 seconds empty, each separated by five slow breaths. Ends with three long breaths and a voiced sigh. Lying down is fine.',
  b:()=>[['Warm-up · three-part breath',forMin(5,[I(2,'Belly',.5),I(2,'Mid-chest',.75),I(1,'Upper chest',.9),O(5,'Exhale evenly')])],['Heat · exhale ladder',seq(11,i=>[I(5,'Inhale 5'),O(5+i,'Exhale '+(5+i))])],
    ['Vitalizing · gentle holds',rep(5,rep(5,[I(5,'Slow breath'),O(5,'Slow breath')]).concat([I(5,'Deep inhale'),H(30,'Hold full. Soft face'),O(6,'Exhale naturally')],rep(5,[I(5,'Slow breath'),O(5,'Slow breath')]),[O(3,'Empty completely',.2),E(15,'Hold empty')]))],
    ['Cool-down · three sighs',[10,20,30].flatMap(h=>[I(10,'Long inhale'),H(h,'Hold '+h),O(5,'Open mouth, sigh "ha"')]).concat([R(120,'Let go of all control')])]]},
sEnergy:{n:'Sequence: Energy boost',tag:'Energy',
  how:'Strong ujjayi 10-5-5, bellows breath with holds, interrupted inhale (viloma 1), then cooling sitali with a lion’s breath exhale. Seated. Tingling during the holds is normal; ease off if it becomes unpleasant.',
  b:()=>[['Warm-up · ujjayi 2:1:1',rep(10,[I(10,'Ocean-sound inhale, fill completely'),H(5,'Hold'),O(5,'Strong, slow exhale')])],
    ['Heat 1 · bellows + full hold',[0,1,2].flatMap(i=>[F(30,1,'Bellows: pump in and out from the belly'),I(3,'Fill up'),H(i==2?60:30,'Hold full'),O(4,'Release')])],
    ['Heat 2 · fast bellows + empty hold',seq(8,i=>[F(15,2,'Faster. Same depth'),O(2,'Empty out',.2),E(i<5?15:30,'Hold empty'),I(3,'Breathe in',.6)])],
    ['Vitalizing · viloma 1',rep(8,viloma(false))],['Cool-down · sitali',rep(5,[I(10,'In through a curled tongue'),H(15,'Hold'),O(4,'Lion’s breath: tongue out, "ha"')]).concat([R(30,'Natural breath')])]]},
sStress:{n:'Sequence: Stress and anxiety relief',tag:'Calm',
  how:'Start by holding something you are grateful for. Pyramid breath 1 to 10 and back, short bursts of breath of fire each ended by a hold and open-mouth release, five rounds of 4-7-8, then alternating 10-10-2 and 2-10-10.',
  b:()=>[['Warm-up · pyramid',[R(20,'Bring to mind something you are grateful for')].concat(seq(10,i=>[I(i+1,'Inhale '+(i+1),.3+.07*(i+1)),O(i+1,'Exhale '+(i+1))]),seq(9,i=>[I(9-i,'Inhale '+(9-i),.3+.07*(9-i)),O(9-i,'Exhale '+(9-i))]))],
    ['Heat · breath of fire',rep(5,[F(8,1.9,'Light, shallow, even nose breaths'),I(3,'Deep inhale'),H(5,'Hold'),O(4,'Open mouth, let it out')])],
    ['Vitalizing · 4-7-8',rep(5,[I(4,'Nose inhale'),H(7,'Hold'),O(8,'Pursed lips')])],['Cool-down · 10-10-2 / 2-10-10',rep(4,[I(10,'Long inhale'),H(10,'Hold'),O(2,'Quick full exhale'),I(2,'Quick full inhale'),H(10,'Hold'),O(10,'Long exhale')]).concat([R(30,'Natural breath')])]]},
sSleep:{n:'Sequence: Sleep',tag:'Calm',
  how:'Do it where you will sleep. Three-part equal breath from 5-5-5 to 10-10-10, alternate nostril 6:12 with a humming exhale, then 4-6-10 lying on your back, then a body scan. Drop the control whenever sleep arrives.',
  b:()=>[['Warm-up · 5-5-5 to 10-10-10',seq(6,i=>[I(5+i,'Inhale '+(5+i),.5+.05*i),H(5+i,'Hold'),O(5+i,'Exhale')])],
    ['Heat · alternate nostril with hum',rep(5,[I(6,'In through the RIGHT'),O(12,'Hum out through the LEFT'),I(6,'In through the LEFT'),O(12,'Hum out through the RIGHT')])],
    ['Vitalizing · 4-6-10',forMin(5,[I(4,'Chest and belly together'),H(6,'Hold'),O(10,'Slow, controlled exhale')])],['Cool-down · body scan',[R(150,'Release face and jaw, shoulders, arms, hands, chest, belly, legs, feet')]]]},
sFocus:{n:'Sequence: Concentration and memory',tag:'Focus',
  how:'Box breathing with a humming exhale, bellows breath with empty holds (chin tucked, belly drawn in), a slow 10-20-10-5 with humming, then alternate nostril. Humming raises nasal nitric oxide. Shorten the 20-second hold before you rush the exhale.',
  b:()=>[['Warm-up · humming box',forMin(5,[I(5,'Nose in'),H(5,'Hold'),O(5,'Hum the exhale'),E(5,'Hold empty')])],
    ['Heat · bellows + empty hold',rep(6,[F(30,1.5,'Bellows: pump the belly'),I(3,'Deep inhale'),O(4,'Empty fully, chin tucked',.2),E(15,'Belly drawn in. Hold empty'),I(3,'Breathe in',.6)])],
    ['Vitalizing · 10-20-10-5',rep(8,[I(10,'Soft, like smelling perfume'),H(20,'Hold'),O(10,'Hum, push the vibration up into the nose'),E(5,'Pause')])],
    ['Cool-down · alternate nostril',rep(5,[I(5,'In LEFT'),O(5,'Hum out RIGHT'),E(3,'Pause'),I(5,'In RIGHT'),O(5,'Hum out LEFT'),E(3,'Pause')])]]},
sAthlete:{n:'Sequence: Athletic performance',tag:'Capacity',
  how:'Lung expansion (a full breath plus two small sips, each held 10 seconds, never to the point of pain), bellows breath with empty and full holds, CO2-tolerance holds, then three maximal holds after ten deep breaths. Seated or lying, never in water.',
  b:()=>[['Warm-up · lung expansion',rep(10,[I(5,'Full inhale',.9),H(10,'Hold. Let the ribs stretch'),I(1,'Small sip',.95),H(10,'Hold'),I(1,'One more sip',1),H(10,'Hold'),O(5,'Out through the mouth'),R(8,'Easy breath')])],
    ['Heat · bellows + holds',rep(3,[F(60,1.5,'Bellows: strong belly pump'),O(3,'Exhale fully',.2),E(30,'Hold empty'),I(4,'Full inhale'),H(60,'Hold full'),O(5,'Release')])],
    ['Vitalizing · CO2 tolerance',rep(5,rep(3,[I(3,'Normal nose breath',.7),O(3,'Out',.4)]).concat([O(3,'Full exhale',.2),E(20,'Hold empty'),I(4,'Single inhale'),H(40,'Hold full'),O(4,'Release')]))],
    ['Cool-down · max holds',rep(3,rep(10,[I(3,'Deep nose inhale'),O(2,'Let go',.4)]).concat([I(4,'Full breath'),X('Hold full for as long as you can stay relaxed. Tap to release','full','openH'),O(5,'Release'),R(20,'Recover')]))]]}
};
const HABIT={
 stretch:['Morning stretches, 12 min','Open the ribs, sides, hips and neck so the diaphragm can move freely. Breathe through the nose throughout and never force a position.',[
  'Crocodile breathing, 1 min. Lie face down, forehead on stacked hands. Breathe into the belly so it presses the floor and the lower back rises. This wakes up the diaphragm.',
  'Cat-cow, 10 slow rounds. On hands and knees: inhale, drop the belly and lift chest and tailbone; exhale, round the whole spine and push the floor away. One breath per movement.',
  'Child’s pose with side reach, 5 breaths per side. Sit back on the heels, arms long, then walk both hands to one side. Breathe into the stretched ribs and feel them widen.',
  'Thread the needle, 5 per side. From hands and knees slide one arm under the other until the shoulder rests down, then open that arm up to the ceiling. Exhale going under, inhale opening.',
  'Low lunge with overhead reach, 5 breaths per side. Back knee down, hips sinking forward, same-side arm reaching up and slightly over. This lengthens the hip flexors, which attach close to the diaphragm.',
  'Standing side bend, 5 breaths per side. Feet hip width, grip one wrist overhead and lean away from it. Send each inhale into the open side of the rib cage.',
  'Chest opener, 5 breaths. Clasp hands behind the back, draw the shoulder blades together and down, lift the breastbone. Or place a forearm on a door frame and turn the chest away.',
  'Neck release, 3 breaths per side. Ear toward shoulder, opposite arm reaching down. Then chin slightly toward the armpit. These are the muscles that overwork in shallow chest breathing.',
  'Lying twist, 5 breaths per side. On your back, knees dropped to one side, arms wide, head turned the other way. Let each exhale soften the twist.',
  'Finish with 5 full three-part breaths lying down: belly, ribs, upper chest, then a slow exhale. Hold any stretch longer if it feels good.']],
 string:['String check-ins','Tie a string or piece of yarn just above the navel, snug enough that it tightens on a full breath. Weeks 1–4.',[
  'Tie it after your morning practice and wear it until bed.','Set two alarms, one in the afternoon and one in the evening.','At each alarm take five slow breaths and feel the string tighten on the inhale. If it does not, the breath is staying in the chest.','From about day 26, wear it only if you still need the reminder.']],
 move:['Breathing squats or slow breath walk, 10 min','Slow movement matched to belly breathing, so the new pattern becomes automatic. Keep it slow enough that the heart rate does not rise.',[
  'Breathing squat: stand with feet a little wider than the hips. Inhale through the nose at the top, belly first.','Exhale slowly as you lower into a comfortable squat, heels down.','Inhale as you rise, again filling the belly first, then the ribs. One squat takes 8–10 seconds.','Slow breath walk: walk at an easy pace, inhale through the nose for 4 steps, exhale for 6 steps.','In both, the first two-thirds of each breath comes from the belly and only the last third from the chest.']],
 cold:['Cold shower, 3–5 min','Below 21 °C, straight after the breathing rounds and meditation.',[
  'Start warm if you need to and turn the water colder every 10 seconds until you reach your limit.','Keep the breath slow and through the nose. Lengthen the exhale when the cold makes you want to gasp.','Relax the shoulders and jaw. The aim is to stay calm in the stress, not to fight it.','Build up from 30 seconds to 3–5 minutes over the weeks.']],
 nose:['Nose-only breathing all day','Mouth closed at rest and during easy training.',[
  'Rest the tongue on the roof of the mouth, lips together, teeth slightly apart.','Notice each time you catch yourself mouth breathing and switch back without judgement.','If you have to open the mouth during easy exercise, slow down until you can keep it closed.']]
};

/* ---------- detail per technique: steps, benefits , tips ---------- */
const D={
belly:{s:['Lie on your back, knees bent if that is more comfortable. Put a light book or your hands on the belly.','Inhale through the nose for 3 and let the belly rise so the book lifts. The chest stays quiet until the end of the breath.','Exhale for 6 and let the book sink, navel moving toward the spine.','Variation, "horizontal breathing": hands on the sides of the waist, push them apart on the inhale and squeeze them together on the exhale. Pressing in with the hands adds resistance and strengthens the breathing muscles.'],
 b:['Calms the body in moments of stress.','Practised daily it becomes the automatic baseline pattern, so you stay relaxed and centred without thinking about it.','The exhale twice as long as the inhale switches on the rest-and-digest side of the nervous system.','Deep diaphragm movement helps the heart circulate blood, which lowers heart rate and blood pressure.'],
 t:'If the chest lifts first, breathe smaller. This is the foundation for everything else in the program, so do not rush past it.'},
box:{s:['Inhale through the nose for the count.','Hold the breath in for the same count. Keep shoulders, chest, jaw and face soft: tensing during the holds defeats the purpose.','Exhale for the same count.','Hold empty for the same count, then repeat. Picture travelling along the four sides of a box.','Set a timer: 3 minutes is the minimum, 10 or more is ideal.'],
 b:['Equal inhale and exhale balance the activating and calming branches of the nervous system.','Counting gives the mind a predictable, controllable rhythm when the surroundings are chaotic. This is why military personnel and first responders use it.','Works both ways: to release stress that is already there, and ahead of a demanding task so you show up composed.','Raises heart rate variability.'],
 t:'Progress the count over time: 4, then 5, 6, 8, even 10 seconds. Shorter sides (2–3 s) keep the sense of control but are more energizing; longer sides are more grounding. You can also make the holds shorter than the breaths.'},
coherent:{s:['Sit tall but at ease. Optionally state an intention before you start.','Breathe in for 5 seconds, low into the belly, through the nose.','Breathe out for 5 seconds through the nose, through pursed lips as if blowing bubbles through a straw, or with a soft "shhh" or hum.','On every exhale relax the "six bridges": face, tongue and throat, hands, diaphragm, pelvic floor, feet.','Imagine blood drawn toward the lungs on the inhale and sent out to the limbs on the exhale. A hand on the heart helps focus.'],
 b:['Five minutes raises heart rate variability and lowers heart rate, blood pressure and cortisol.','Ten to twelve minutes is said to bring a theta-dominant "awakened mind" state linked to creativity, intuition and meditation.','The morning session is the most important of the day; the midday one clears the morning’s stress, prepares digestion and helps prevent the afternoon slump; the evening one moves you from work mode to home.','One or two minutes before a meeting or when you are upset calms and focuses you.'],
 t:'Prescription: 6 breaths a minute, 5 minutes, 3 times a day. Do the first one before coffee or breakfast. It is a feeling exercise, not a thinking one: put all attention on the sensations of the breath.'},
triangle:{s:['Inhale for the count.','Exhale for the count.','Pause empty for the count, resting, before the next inhale.','Once it feels easy, lengthen each side, or try unequal sides: 2 in, 4 pause, 6 out is a "relaxing triangle".'],
 b:['Inhale, exhale, pause is how everyone breathes at rest, so this trains your natural rhythm consciously.','Promotes relaxation and mindfulness.','If you know your comfortable triangle from a calm state and return to it under stress, the body cannot stay stressed for long.','Gradually stretching the sides builds lung capacity and comfort with longer breaths.'],
 t:'First job: find your own comfortable triangle while you are calm. "Stretch, not snap": a little discomfort is training, strain is too much.'},
f478:{s:['Sit or lie comfortably. Empty the lungs with a whooshing exhale.','Inhale quietly through the nose for 4.','Hold for 7. Relax the muscles and enjoy the stillness.','Exhale through pursed lips for 8 with a soft whoosh, like blowing on hot soup, not blowing out candles.','Do 4–8 cycles.'],
 b:['Acts like a reset button for stress.','Studies on this and similar patterns report less stress and anxiety, better heart and lung function, lower blood pressure, better concentration and fewer or milder migraines.','Triggers the relaxation response and can help you fall asleep.','The pursed-lip exhale raises pressure in the lungs, opens their deeper areas and stimulates the vagus nerve.','At about three breaths a minute, carbon dioxide builds gently, which slows the heart and relaxes body and mind.'],
 t:'The ratio matters more than the length. If 7 and 8 are a struggle, use 2 – 3.5 – 4 and keep the proportions. Any exhale 1.5 to 2.5 times the inhale is calming.'},
sigh:{s:['Inhale through the nose until comfortably full.','Take a second, shorter sip of air on top to stretch the lungs a little more.','Exhale long and slow through the mouth until empty.','Repeat for about 5 minutes.'],
 b:['The long slow exhale version gives steady calming, relaxation and recovery. Five minutes a day of this pattern has been studied at Stanford.','A quick, sharp exhale after the double inhale releases tension and snaps you out of a stressed or panicked moment.'],
 t:'Use the slow version as a daily practice and the sharp version as a one-or-two-breath rescue.'},
nadi:{s:['Right hand: thumb closes the right nostril, ring finger closes the left. Index and middle finger can rest between the eyebrows.','Empty the lungs first. Close the right nostril; exhale then inhale through the left.','Switch. Close the left nostril; exhale then inhale through the right.','Keep alternating for up to 10 minutes at any steady pace that is comfortable.','Traditional counts: exhale 4, hold 2, inhale 4, hold 2; or 4-4-4-4.'],
 b:['A balancing practice: harmonizes the active and receptive sides and the two hemispheres of the brain.','Naturally calming and neutralizes busy thoughts; used in the sleep and concentration sequences for that reason.','Speeding it up keeps the emotional balance but makes it physically energizing.'],
 t:'Breathe softly enough that the air is almost silent. One nostril is usually more open than the other; that is the normal nasal cycle.'},
ladder:{s:['Start with 5 seconds in, 5 seconds out.','Add one second to both on every breath: 6:6, 7:7, up to the top of the ladder.','Breathe only as deeply as each length needs. Five seconds is about a third of a full breath; by the top the lungs are full.','Come back down one second at a time until the breath is effortless again.'],
 b:['Equal breathing regulates the autonomic nervous system and promotes a balanced, present state.','Lengthening the breath slows breathing and builds carbon dioxide, which is calming.','Gradually fuller breaths warm up the diaphragm and stretch the muscles between the ribs.','Meeting a manageable challenge and returning to ease trains the mind to feel challenged without feeling stressed.'],
 t:'The last few rungs are 20–30 second breaths. If you gasp, your top rung is too high; use 12 for now.'},
relaxladder:{s:['Inhale for 5, chest and belly moving together.','Exhale for 5, then 6, then 7, adding a second each breath up to 15.','Finish with a minute of natural breathing.'],
 b:['A longer exhale than inhale brings relaxation and a sense of being grounded.','Carbon dioxide rises slowly, which stimulates the calming side of the nervous system even as the breath gets harder.','Prepares you for comfortable breath holds.'],
 t:'Slow the exhale by narrowing the throat or lips slightly, not by clenching.'},
sniff:{s:['Take 2 to 4 short, quick, powerful sniffs through the nose, into the chest.','Blow the breath out through pursed lips: "pooh".','Keep going for 2 minutes.'],
 b:['A Sufi technique for grogginess on waking: two minutes should leave you buzzing with energy.','Works like a cup of coffee with no caffeine.'],
 t:'If you wake already tense or anxious, skip it and start with a calming technique instead.'},
fire:{s:['Sit tall or cross-legged, hands on knees or lower belly.','Exhale sharply through the nose by snapping the navel and solar plexus toward the spine.','Let the inhale happen by reflex. All the effort is in the exhale.','Start slowly, then settle into a steady pump of 1, 2 or 3 breaths per second.','Practise from 30 seconds up to several minutes, with natural breathing between rounds.'],
 b:['Activates the nervous system: you feel alert and energized within seconds, where caffeine takes about 20 minutes and can end in a crash.','A quick fix for tiredness or lack of focus during the day.','Strengthens the core and diaphragm.','Combined with slow reverse breaths it is taught as a "detoxing breath" that supports circulation and digestion.'],
 t:'Dizziness and light-headedness are common. Do not push: slow down or return to natural breathing. Be very gentle, or skip it, if you are pregnant or have a heart condition.'},
connected:{s:['Check how you feel before you start.','Breathe with no pauses: inhale flows into exhale, exhale into inhale.','Pull the inhale in actively; let the exhale fall out with no pushing or blowing.','Take four small breaths, then one big one with a sigh of relief. Repeat four times for 20 breaths.','Rest with eyes closed for a minute or two and notice what was activated.','Round 2 at double speed, round 3 at half the original speed. Keep the 4-to-1 pattern.'],
 b:['A short form of circular connected breathing: a way to take control, regain balance, reset and feel better anywhere.','Faster connected breathing activates energy; slower connected breathing relaxes.','Starts a strong energy cycle in the body; longer connected-breathing sessions are used for emotional release.'],
 t:'Stay in one channel: all nose or all mouth. It can bring on tingling or other signs of over-breathing while you learn it; slow down if so. Try it sitting, lying and standing.'},
power:{s:['Sit or lie down. Take a few slow breaths to settle.','Take 30–40 deep breaths: full inhale, relaxed exhale with no force. Nose in and mouth out, or all mouth.','After the last one, let the air out and hold empty for as long as is comfortable.','When the urge is strong or the diaphragm flutters, take one full breath in and hold it 10–15 seconds.','Release. That is one round. Do 3–5 rounds.'],
 b:['Breath-hold time roughly doubles straight away, because the deep breathing lowers carbon dioxide, the trigger for the urge to breathe.','Over a few weeks breathing eases and capacity grows.','Used to train stress resilience, energy and focus, and to work through fear and old emotional blocks. It is also claimed to support the immune response.','A voluntary, short stress response that builds resilience to everyday stress.'],
 t:'Tingling lips, hands or feet and light-headedness are normal effects of controlled hyperventilation. Never do it in water, in the bath or driving. It is a deliberate practice for set times, not a way to breathe all day. Do not use it before measuring your BOLT score.'},
co2:{s:['Take a normal breath in and a normal breath out.','Do not breathe in. Pause for your comfortable time, relaxing everything you can.','Resume normal breathing. If you need a big recovery breath, the pause was too long.','Breathe freely for a short while, then repeat. Practise 10–20 minutes, ideally 2–3 times a day.','Add 2–3 seconds to the pause every two or three days.'],
 b:['Trains the system to tolerate more carbon dioxide comfortably, which is what makes breathing light and efficient.','Your maximum hold rises on its own without ever forcing it.','Raises your BOLT score, which is linked to more efficient lungs and better athletic endurance.','Builds body awareness and self-control; even a short hold creates an instant inner stillness.','A long hold is reported to be followed by about 30 minutes of increased blood flow to the brain.'],
 t:'Work with the first, subtle urge to breathe, not the limit. Fighting the urge brings few long-term benefits; relaxing into it does.'},
walk:{s:['Walk normally for a minute, breathing through the nose.','Exhale, then hold the breath (pinch the nose if you like) and keep walking.','First two rounds: stop at a light wish for air. Later rounds: go to a medium-strong urge.','Breathe in gently through the nose, then take tiny sips of air for 15 seconds.','Breathe normally for 30 seconds and repeat, 8–10 rounds.'],
 b:['Simulates high-altitude training without the altitude: oxygen saturation drops, which signals the body to carry more oxygen.','Aimed at endurance and athletic performance.','Breath holding is also claimed to help with weight loss.'],
 t:'Raise your BOLT score with the basic pause training first. Walk somewhere safe, never near traffic or water, and stop if you feel faint.'},
anapana:{s:['Sit comfortably, right after the breathing rounds while the body is quiet.','Let the breath be completely natural.','Rest attention where the air enters and leaves the nostrils.','Each time the mind wanders, notice it and come back.'],
 b:['Uses the relaxed state after breathwork to let the mind settle into real meditation.','The breath is always available as an object of attention, and the practice belongs to no religion.','Trains steady attention.'],
 t:'No counting and no control. If the breath is shallow, let it be shallow.'},
recover:{s:['Straight after training, exhale normally through the nose.','Pinch the nose and hold for 2–5 seconds.','Breathe normally through the nose for 10 seconds.','Repeat for 3–5 minutes, then let the breath go.'],
 b:['Brings breathing down faster after hard efforts.','Adds a small dose of carbon-dioxide tolerance work to every training session.'],
 t:'Keep the holds short. This is a cool-down, not a test.'},
test:{s:['Sit quietly for a few minutes. Do not test after fast breathing or exercise.','Normal breath in, normal breath out, then hold.','Comfortable pause: stop the clock at the first clear, subtle urge to breathe.','BOLT score, or controlled pause: stop at a strong but manageable urge. You should be able to breathe normally afterwards.'],
 b:['Gives a simple number to track your carbon-dioxide tolerance week to week.','The comfortable pause sets the length for your pause training.'],
 t:'Always measure the same way, at the same time of day if you can.'},
sEquanimity:{s:['Warm-up: equal breaths growing from 5:5 to 15:15.','Heat: alternate-nostril box breathing, 5 seconds per side of the box, light breaths.','Vitalizing: viloma 3. Inhale in three parts with pauses (3-2, 2-3, 1-4), exhale in three parts with pauses (1-4, 2-3, 3-2), about 30 seconds per breath.','Cool-down: equal breaths shrinking from 15:15 back to 5:5, then sit with the natural breath.'],
 b:['Brings you back to centre whether you arrive flat and lethargic or wound up and agitated.','Builds calm that holds under pressure: emotional and mental stability.','Raises heart rate variability and supports the part of the nervous system used for relating well to others.'],
 t:'Keep it stimulating but never hard. If the interrupted breathing makes you hungry for air, count faster.'},
sRelax:{s:['Before starting, acknowledge the thoughts and worries that are present without pushing them away.','Warm-up: 5 minutes of three-part breathing, 5 in (belly 2, mid-chest 2, upper chest 1) and 5 out, filling to about 60–70%.','Heat: keep the 5-second inhale and lengthen the exhale to 15.','Vitalizing: five slow breaths, hold full 30 seconds; five slow breaths, hold empty 15 seconds. Repeat for 15–20 minutes.','Cool-down: three breaths of 10 seconds in, held 10, 20 then 30 seconds, each released with an open-mouth "ha".'],
 b:['Calms the mind, eases the nervous system and lets body and mind repair.','Rising carbon dioxide slows the heart, lowers blood pressure and opens the airways.','Gradually raises carbon-dioxide tolerance.','The sighs release stress and anxiety.'],
 t:'Lying down with one hand on the belly and one on the chest helps you feel safe and let go. If a hold is hard, add recovery breaths or shorten it.'},
sEnergy:{s:['Warm-up: strong ujjayi (narrowed-throat, ocean sound). Inhale 10, hold 5, exhale 5, ten times.','Heat 1: bellows breath, one breath a second for 30 seconds, then hold full 30 seconds. Three rounds, the last hold 60.','Heat 2: bellows at two breaths a second for 15 seconds, then hold empty 15 seconds, five rounds; three more rounds with 30-second holds.','Vitalizing: viloma 1. Inhale belly 3, pause 2, mid-chest 2, pause 3, upper chest 1, hold 4, exhale 5.','Cool-down: inhale 10 through a curled tongue (sitali), hold 15, exhale with lion’s breath: tongue out, eyes up, "ha".'],
 b:['Wakes up motivation and drive when you feel flat or stuck: likened to several coffees without the jitters.','Stimulates the mobilizing side of the nervous system while the holds keep it from tipping into restlessness.','Empty holds lower blood oxygen and stimulate red blood cell production, which supports VO2 max and lasting energy.','Bellows breath strengthens the core and diaphragm.'],
 t:'Aim for only mild air hunger by the last empty hold. Tingling in fingers, face or belly during the holds is expected.'},
sStress:{s:['Warm-up: hold something you are grateful for, then breathe 1:1, 2:2 … up to 10:10 and back down to 1:1.','Heat: 15 quick, light, shallow nose breaths (7–10 seconds), then a deep inhale, a 5-second hold and an open-mouth exhale. Five rounds.','Vitalizing: 4-7-8 with a pursed-lip exhale, five cycles.','Cool-down: alternate 10 in – 10 hold – 2 out with 2 in – 10 hold – 10 out.'],

    <div class="set-row" style="border:0;padding:0"><label for="br-pause">Pause (seconds)</label><input type="number" id="br-pause" min="3" max="120" value="${B.pause}" inputmode="numeric" style="width:90px"></div></div>`;
  h += `<div class="section-title br-h">Best holds</div><div class="br-stats three">${[['empty', 'empty, after power breathing'], ['full', 'full lungs, athletic sequence'], ['walk', 'walking hold']].map(([k, l]) => `<div class="metric" style="grid-template-columns:1fr"><div class="val" style="text-align:left">${best(k) ? best(k) + 's' : '—'}</div><div class="meta">${l}</div></div>`).join('')}</div>`;
  return h;
}

/* ---------- BREATHWORK: guided pacer ---------- */
const BP_LAB = { in: 'Inhale', out: 'Exhale', hold: 'Hold', empty: 'Hold empty', rest: 'Rest', fast: 'Fast breathing', openE: 'Hold empty', openH: 'Hold' },
      BP_COL = { in: '--b-in', out: '--b-out', hold: '--b-hold', empty: '--b-hold', rest: '--b-rest', fast: '--b-in', openE: '--b-hold', openH: '--b-hold' },
      BP_TONE = { in: 440, out: 294, hold: 349, empty: 262, rest: 392, fast: 494, openE: 262, openH: 349 };
let BP = null, bpAudio = null, bpWake = null;
document.body.insertAdjacentHTML('beforeend', `<div id="bplayer" hidden>
  <div class="bp-top"><div class="eyebrow" id="bp-seg"></div><h2 id="bp-title"></h2><div id="bp-prog"><i></i></div><div class="mut num" id="bp-left" style="font-size:13px"></div></div>
  <div id="bp-stage"><div id="bp-ring"><div id="bp-orb"></div><div id="bp-orbline"></div><div id="bp-count">0</div></div></div>
  <div class="bp-bottom"><div id="bp-phase">Ready</div><p id="bp-cue" class="mut"></p>
    <div class="bp-btns"><button class="btn" id="bp-main">Start</button><button class="btn ghost" id="bp-skip">Next part</button><button class="btn ghost" id="bp-sound">Sound on</button><button class="btn ghost" id="bp-end">End</button></div></div></div>`);
const bp$ = id => document.getElementById(id);
function bpTone(f){ if (!BS().sound || !bpAudio) return; try { const o = bpAudio.createOscillator(), g = bpAudio.createGain(); o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0, bpAudio.currentTime); g.gain.linearRampToValueAtTime(.07, bpAudio.currentTime + .03); g.gain.exponentialRampToValueAtTime(.0001, bpAudio.currentTime + .5); o.connect(g).connect(bpAudio.destination); o.start(); o.stop(bpAudio.currentTime + .55); } catch (e) {} }
function bpOrb(sc, col){ ['bp-orb', 'bp-orbline'].forEach(id => { bp$(id).style.transform = 'scale(' + sc + ')'; bp$(id).style.setProperty('--pc', 'var(' + col + ')'); }); }
function bpOpen(s, key, date){
  const segs = BR.build(s), steps = [];
  segs.forEach(([nm, arr], si) => arr.forEach(st => steps.push(Object.assign({ seg: nm, si }, st))));
  BP = { s, key, date, steps, i: -1, run: false, scale: .3, from: .3, t0: 0, el: 0, total: steps.reduce((a, b) => a + b.s, 0), spent: 0, nseg: segs.length };
  bp$('bp-title').textContent = BR.title(s);
  bp$('bp-seg').textContent = segs.length > 1 ? segs.map(x => x[0].split(' · ')[0]).join(' → ') : BR.spec(s).ex.tag;
  bp$('bp-phase').textContent = 'Ready'; bp$('bp-phase').style.setProperty('--pc', 'var(--b-in)');
  bp$('bp-cue').textContent = BR.spec(s).ex.how; bp$('bp-count').textContent = Math.round(BP.total / 60) + '′';
  bp$('bp-main').textContent = 'Start'; delete bp$('bp-main').dataset.close; bp$('bp-skip').hidden = segs.length < 2;
  bp$('bp-sound').textContent = BS().sound ? 'Sound on' : 'Sound off'; bp$('bp-prog').firstChild.style.width = '0'; bp$('bp-left').textContent = '';
  bpOrb(.3, '--b-in'); bp$('bplayer').hidden = false; document.body.style.overflow = 'hidden';
}
function bpNext(){
  if (!BP) return; const prev = BP.steps[BP.i]; if (prev) BP.spent += prev.s; BP.i++;
  if (BP.i >= BP.steps.length) return bpFinish();
  const st = BP.steps[BP.i]; BP.from = BP.scale; BP.t0 = performance.now(); BP.el = 0;
  bp$('bp-phase').textContent = BP_LAB[st.t]; bp$('bp-phase').style.setProperty('--pc', 'var(' + BP_COL[st.t] + ')'); bp$('bp-cue').textContent = st.c || '';
  if (BP.nseg > 1) bp$('bp-seg').textContent = st.seg;
  bp$('bp-main').textContent = st.t.startsWith('open') ? 'Breathe' : 'Pause'; bpTone(BP_TONE[st.t]);
}
function bpFrame(now){
  if (!BP) return;
  if (BP.run) {
    const st = BP.steps[BP.i]; BP.el = (now - BP.t0) / 1000;
    const open = st.t.startsWith('open'), f = open ? 0 : Math.min(1, BP.el / st.s), ease = .5 - .5 * Math.cos(Math.PI * f);
    let sc = BP.from;
    if (st.t === 'in') sc = BP.from + ((st.to || 1) - BP.from) * ease;
    else if (st.t === 'out') sc = BP.from + ((st.to || .3) - BP.from) * ease;
    else if (st.t === 'fast') sc = .55 + .17 * Math.sin(2 * Math.PI * st.r * BP.el);
    else if (st.t === 'rest') sc = BP.from + (.5 - BP.from) * Math.min(1, BP.el / 3) + .03 * Math.sin(BP.el * 1.1);
    BP.scale = sc; bpOrb(sc.toFixed(3), BP_COL[st.t]);
    const left = open ? BP.el : st.s - BP.el;
    bp$('bp-count').textContent = open || st.s <= 90 ? Math.max(open ? 0 : 1, open ? Math.floor(left) : Math.ceil(left)) : Math.floor(left / 60) + ':' + pad(Math.floor(left % 60));
    const done = BP.spent + (open ? 0 : BP.el); bp$('bp-prog').firstChild.style.width = Math.min(100, 100 * done / BP.total) + '%';
    const rem = Math.max(0, BP.total - done); bp$('bp-left').textContent = Math.floor(rem / 60) + ':' + pad(Math.floor(rem % 60)) + ' left';
    if (!open && BP.el >= st.s) { if (st.t === 'fast' || st.t === 'rest') BP.scale = .5; bpNext(); }
  }

}
function bpRelease(){ try { bpWake && bpWake.release(); } catch (e) {} bpWake = null; }
function bpFinish(){
  const p = BP; BP = null; if (p.key && p.date) brToggle(p.date, p.key, true); bpTone(523); setTimeout(() => bpTone(659), 250);
  bp$('bp-phase').textContent = 'Done'; bp$('bp-cue').textContent = 'Sit for a moment and notice how you feel.'; bp$('bp-count').textContent = '✓';
  bp$('bp-main').textContent = 'Close'; bp$('bp-main').dataset.close = '1'; bp$('bp-prog').firstChild.style.width = '100%'; bp$('bp-left').textContent = ''; bpRelease();
}
function bpClose(){ BP = null; bpRelease(); delete bp$('bp-main').dataset.close; bp$('bplayer').hidden = true; document.body.style.overflow = ''; render(); }
bp$('bp-main').onclick = async () => {
  if (bp$('bp-main').dataset.close) return bpClose();

  const st = BP.steps[BP.i];
  if (st.t.startsWith('open') && BP.run) {
    const v = Math.round(BP.el), B = BS();
    if (st.rec === 'pause') { if (v >= 3) B.pause = v; }
    else if (st.rec === 'bolt') B.bolt.push({ d: brToday(), v });
    else if (st.rec) B.holds.push({ d: brToday(), k: st.rec, v });
    persist('breath'); BP.total += BP.el - st.s; st.s = BP.el; bpNext(); return;
  }
  BP.run = !BP.run; if (BP.run) BP.t0 = performance.now() - BP.el * 1000; bp$('bp-main').textContent = BP.run ? 'Pause' : 'Resume';
};
bp$('bp-skip').onclick = () => { if (!BP || BP.i < 0) return; const si = BP.steps[BP.i].si; let j = BP.i; while (j < BP.steps.length && BP.steps[j].si === si) j++; if (j >= BP.steps.length) return; BP.spent = BP.steps.slice(0, j).reduce((a, b) => a + b.s, 0) - BP.steps[j - 1].s; BP.i = j - 1; BP.scale = .4; BP.run = true; bpNext(); };
bp$('bp-sound').onclick = () => { BS().sound = !BS().sound; bp$('bp-sound').textContent = BS().sound ? 'Sound on' : 'Sound off'; persist('breath'); };
bp$('bp-end').onclick = bpClose;

/* ---------- BREATHWORK: events ---------- */

const ICONS = {

  breath:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h6"/></svg>',

};

  if (focusId) { const el = document.getElementById(focusId); if (el && el.tagName === 'INPUT' && el.type === 'text') { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch(e){} } }

function entry(code){
  const dk = DAYKEYS[V.dayIdx]; const lg = ensureLog(V.week, dk);

document.addEventListener('click', ev => {

  else if (a === 'day') { V.dayIdx = +b.dataset.i; V.open = null; render(); }
  else if (a === 'open') { V.open = V.open === b.dataset.c ? null : b.dataset.c; render(); }
  else if (a === 'ready') { const lg = ensureLog(V.week, DAYKEYS[V.dayIdx]); lg.readiness = lg.readiness === b.dataset.v ? null : b.dataset.v; saveSession(); render(); }
  else if (a === 'rate') { const e = entry(b.dataset.c); e.r = e.r === b.dataset.v ? null : b.dataset.v; e.t = Date.now(); pruneEntry(b.dataset.c); saveSession(); render(); if (e.r) toast('Saved'); }
  else if (a === 'delm') { S.metrics.entries = S.metrics.entries.filter(e => e.id !== b.dataset.id); persist('metrics'); render(); toast('Entry deleted'); }

  else if (a === 'backup') { doBackup(); }

let resT;
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.act === 'res') { const e = entry(t.dataset.c); e.res = t.value.slice(0, 80); e.t = Date.now(); clearTimeout(resT); resT = setTimeout(() => { pruneEntry(t.dataset.c); saveSession(); render(); }, 900); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.act === 'pain') { const e = entry(t.dataset.c); e.pain = t.checked; e.t = Date.now(); pruneEntry(t.dataset.c); saveSession(); render(); }

async function doBackup(){
  const data = JSON.stringify(S, null, 2);
  const filename = 'movement-athlete-backup-' + iso(new Date()) + '.json';
  if (STANDALONE) {
    try {
      const file = new File([data], filename, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Movement Athlete backup' }); return; }
    } catch(e) { if (e && e.name === 'AbortError') return; }
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Backup saved to Downloads'); return;
  }
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (!dl) { toast('Downloads are not available here'); return; }
    await dl.save({ filename: 'movement-athlete-backup-' + iso(new Date()) + '.json', data });
  } catch(e) { if (e && e.code && e.code !== 'cancelled') toast('Backup not saved'); }
}
function validBackup(o){ return o && typeof o === 'object' && o.profile && typeof o.logs === 'object' && o.metrics && Array.isArray(o.metrics.entries); }
function applyImport(o){

  new Set([...oldLogs, ...Object.keys(S.logs)]).forEach(k => persist('log-' + k));
  new Set([...oldMonths, ...Object.keys(S.supplog)]).forEach(m => persist('supplog-' + m));
  persist('profile'); persist('metrics'); persist('supps');
  const p = todayPos(); V.week = p.week; V.dayIdx = p.dayIdx;
}

migrateCodes();

initDb();
